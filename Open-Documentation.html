"title":"Server safety",
"html":"\u003ch1 id=\"h-server-safety\"\u003eServer safety\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › Server safety\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContents:\u003c/strong\u003e \u003ca href=\"#docs/Server-safety.md:the-rules\"\u003eThe rules\u003c/a\u003e · \u003ca href=\"#docs/Server-safety.md:keep-jellyfin-private\"\u003eKeep Jellyfin private\u003c/a\u003e ·\n\u003ca href=\"#docs/Server-safety.md:sign-ins\"\u003eSign-ins\u003c/a\u003e · \u003ca href=\"#docs/Server-safety.md:exactly-what-can-be-sent\"\u003eExactly what can be sent\u003c/a\u003e · \u003ca href=\"#docs/Server-safety.md:side-effects\"\u003eSide effects\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"h-the-rules\"\u003eThe rules\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eRule\u003c/th\u003e\n\u003cth\u003eHow the tools keep it\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eAdd-only\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eOne tuner, nothing else. No library, user, device, plugin, scheduled task, guide source or conversion setting is ever written.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eBackup first\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eBefore any change: the whole Live TV configuration and a fingerprint of libraries, users, devices, plugins, task triggers and conversion settings are saved in your private folder. The backups can hold tuner addresses and a guide provider's sign-in (for example a listings service user and password hash), so they are written readable by you only (folder 0700, files 0600 on macOS/Linux; \u003ccode\u003e%LOCALAPPDATA%\u003c/code\u003e is per-user on Windows). Never share them.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eDry run first\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eadd\u003c/code\u003e and \u003ccode\u003eremove\u003c/code\u003e without \u003ccode\u003e--yes\u003c/code\u003e only read, then show exactly what would be sent.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eProof after\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eAfter \u003ccode\u003eadd\u003c/code\u003e: exactly one new tuner and every other Live TV setting identical; the fingerprint unchanged. After \u003ccode\u003eremove\u003c/code\u003e: the Live TV configuration equal to the backup. Anything else is a \u003cstrong\u003eFAIL\u003c/strong\u003e with the manual undo.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eTagged\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eThe tuner is named \"Chromavision Live TV (added by Chromavision tools)\" (Chromatic Manager uses the same name; its older \"Chromatic TV (added by Chromatic Manager)\" counts too, so a tuner is never added twice); its id is recorded, and \u003ccode\u003eremove\u003c/code\u003e deletes only that id, from this tool's record or Chromatic Manager's.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eCannot overload the server\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eThe tuner's stream limit is 1 (or 2): a further channel is refused by the server instead of starting another conversion. The console asks for at most 400 kbit/s, 160 × 120, 15 pictures a second, one stream.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eCleans up\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eThe console closes every channel it opened (stop conversion, then close the live stream). Jellyfin itself ends a conversion about 10 seconds after its viewer has gone.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eNo plugins, no restarts\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eLive TV is built into Jellyfin; adding a tuner takes effect at once.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eNothing private printed\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eThe tools print PASS / FAIL / INFO and counts: never an address, path, name, token or id.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003ch2 id=\"h-keep-jellyfin-private\"\u003eKeep Jellyfin private\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eDo not expose Jellyfin to the internet\u003c/strong\u003e for Chromavision: no port forward on your router, no public reverse\nproxy. The console and the PC tools need it on your home network only.\u003c/li\u003e\n\u003cli\u003eAllow Jellyfin's port (8096) on the server's firewall for your \u003cstrong\u003eprivate\u003c/strong\u003e network only.\u003c/li\u003e\n\u003cli\u003eKeep the server up to date with Jellyfin's own releases.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"h-sign-ins\"\u003eSign-ins\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eThe console uses a normal user\u003c/strong\u003e, not an administrator, with Live TV allowed, signed in with Quick Connect (its\nown revocable sign-in; your password never goes to the console).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eThe administrator is used only on the PC, only for set-up\u003c/strong\u003e: \u003ccode\u003e--ask-admin\u003c/code\u003e asks for the name and password, keeps\nthem in memory for that one run, signs in as a new device made for that run (so no other device's sign-in can be\nreplaced) and signs that one session out at the end. Nothing is saved.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eYour other devices and sessions are never signed out.\u003c/strong\u003e The tools never use \"sign out everywhere\", device\ndeletion or API-key calls.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"h-exactly-what-can-be-sent\"\u003eExactly what can be sent\u003c/h2\u003e\n\u003cp\u003eEvery request that could change something is checked against a short allow-list before it is sent; anything else is\nrefused unsent:\u003c/p\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eCommand\u003c/th\u003e\n\u003cth\u003eChanging requests it may send\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003echeck\u003c/code\u003e, \u003ccode\u003estatus\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003enone (read-only)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eadd --yes\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003ePOST /LiveTv/TunerHosts\u003c/code\u003e, only for a tuner with Chromavision's name\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eremove --yes\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eDELETE /LiveTv/TunerHosts?id=\u003c/code\u003e, only the recorded id\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erefresh-guide --yes\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003ePOST /ScheduledTasks/Running/{id}\u003c/code\u003e, only Jellyfin's own Refresh Guide task\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etrial --yes\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eadd and delete its own test tuner (reading a list you built with the same rules as the main list); open, stop and close one of its test channels\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eany, with \u003ccode\u003e--ask-admin\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eits own sign-in, and the sign-out of that one session\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eThe tests in \u003ccode\u003etools/tests/\u003c/code\u003e run every command against a fake server that holds someone else's tuner, libraries,\nusers and sessions, and check that nothing else is ever sent or printed.\u003c/p\u003e\n\u003ch2 id=\"h-side-effects\"\u003eSide effects\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eWhile the tuner is there, its channels show under \u003cstrong\u003eLive TV\u003c/strong\u003e in your other Jellyfin apps too, for users allowed\nLive TV.\u003c/li\u003e\n\u003cli\u003eAfter the tuner is added (and after \u003ccode\u003erefresh-guide\u003c/code\u003e), Jellyfin refreshes its channel list once in the background.\u003c/li\u003e\n\u003cli\u003eEach watched channel is one conversion on the server and one stream from the internet.\u003c/li\u003e\n\u003cli\u003eJellyfin's activity log keeps its own lines about these changes.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/Undo-everything.md\"\u003eUndo everything\u003c/a\u003e\u003c/p\u003e"
},

"path":"docs/Undo-everything.md",
"title":"Undo everything",
"html":"\u003ch1 id=\"h-undo-everything\"\u003eUndo everything\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › Undo everything\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContents:\u003c/strong\u003e \u003ca href=\"#docs/Undo-everything.md:on-the-server\"\u003eOn the server\u003c/a\u003e · \u003ca href=\"#docs/Undo-everything.md:on-the-pc\"\u003eOn the PC\u003c/a\u003e · \u003ca href=\"#docs/Undo-everything.md:on-the-console\"\u003eOn the console\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"h-on-the-server\"\u003eOn the server\u003c/h2\u003e\n\u003cp\u003eIf Chromatic Manager added the tuner, its \u003cstrong\u003eSettings › Live TV channels › Remove\u003c/strong\u003e does all of this (and deletes the\nlist file it wrote). By hand:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cp\u003eRemove the tuner (a dry run first, then for real; it also finds a tuner Chromatic Manager added):\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003epy -3 tools\\livetv_tuner.py remove --ask-admin\npy -3 tools\\livetv_tuner.py remove --yes --ask-admin\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIt deletes exactly the tuner it added and proves the Live TV settings equal the backup taken before the add.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eLet its channels leave the list: \u003ccode\u003epy -3 tools\\livetv_tuner.py refresh-guide --yes --ask-admin\u003c/code\u003e (or Dashboard ›\nScheduled Tasks › Refresh Guide).\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eDelete your channel list file from the folder you copied it to (for example \u003ccode\u003e\u0026lt;Jellyfin config\u0026gt;/chromavision/\u003c/code\u003e).\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eOptional: turn \u003cstrong\u003eAllow Live TV access\u003c/strong\u003e off again for the console's user, if you turned it on only for this.\u003c/p\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cstrong\u003eBy hand, without the tools:\u003c/strong\u003e Jellyfin \u003cstrong\u003eDashboard › Live TV\u003c/strong\u003e, delete the tuner named \"Chromavision Live TV\n(added by Chromavision tools)\", then refresh the guide. Nothing else was changed, so nothing else needs undoing.\u003c/p\u003e\n\u003ch2 id=\"h-on-the-pc\"\u003eOn the PC\u003c/h2\u003e\n\u003cp\u003eDelete your private folder \u003ccode\u003e%LOCALAPPDATA%\\Chromavision\u003c/code\u003e (on macOS/Linux \u003ccode\u003e~/.local/share/chromavision\u003c/code\u003e): your list,\nthe tuner record and the backups. Then delete the repository folder. Nothing was installed anywhere else.\u003c/p\u003e\n\u003ch2 id=\"h-on-the-console\"\u003eOn the console\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eBack to Local Weather only:\u003c/strong\u003e Chromatic Manager › \u003cstrong\u003eSettings › Apps\u003c/strong\u003e › \"Local Weather only\" (do this after removing\nthe tuner).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eHide the TV row:\u003c/strong\u003e on the start-up menu, highlight \u003cstrong\u003eTV\u003c/strong\u003e, press \u003cstrong\u003eSelect\u003c/strong\u003e, then \u003cstrong\u003eA\u003c/strong\u003e (\"Hide TV?\"); or turn TV off\nin \u003cstrong\u003eSettings › Apps\u003c/strong\u003e. Bring it back with \u003cstrong\u003eOther firmware › Show hidden apps\u003c/strong\u003e or Settings › Apps.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eForget your weather location:\u003c/strong\u003e Chromatic Manager › \u003cstrong\u003eSettings › Weather location › Use default\u003c/strong\u003e. It erases the\ntwo location records on the console and the copy on your PC.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eRemove the start-up menu altogether:\u003c/strong\u003e Chromatic Manager › \u003cstrong\u003eFix a problem › Remove menu\u003c/strong\u003e (or \u003cstrong\u003eRestore\noriginal\u003c/strong\u003e). The console is then exactly official again, games untouched\n(\u003ca href=\"https://github.com/ChaoticSPARTAN1/Jellymatic/blob/main/docs/Recovery.md\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eJellymatic recovery guide\u003c/a\u003e).\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/Troubleshooting.md\"\u003eTroubleshooting\u003c/a\u003e\u003c/p\u003e"
},

"path":"docs/Troubleshooting.md",
"title":"Troubleshooting",
"html":"\u003ch1 id=\"h-troubleshooting\"\u003eTroubleshooting\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › Troubleshooting\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContents:\u003c/strong\u003e \u003ca href=\"#docs/Troubleshooting.md:local-weather\"\u003eLocal Weather\u003c/a\u003e · \u003ca href=\"#docs/Troubleshooting.md:live-tv-on-the-console\"\u003eLive TV on the console\u003c/a\u003e · \u003ca href=\"#docs/Troubleshooting.md:the-pc-tools\"\u003eThe PC tools\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"h-local-weather\"\u003eLocal Weather\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eProblem\u003c/th\u003e\n\u003cth\u003eTry\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eWi-Fi isn't set up yet\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eLocal Weather needs Wi-Fi: press \u003cstrong\u003eSelect\u003c/strong\u003e to add your network on the console, or use Chromatic Manager\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePages show \u003ccode\u003e--\u003c/code\u003e and \u003cstrong\u003eUPDATING\u003c/strong\u003e for a long time\u003c/td\u003e\n\u003ctd\u003eThe console needs internet access through your Wi-Fi. Wait a minute; leave and open the channel again\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eThe clock shows \u003ccode\u003e--:--\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eThe time service did not answer yet; it is set from the first weather reply too\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eThe wrong place\u003c/td\u003e\n\u003ctd\u003eChromatic Manager › Settings › Weather location; an older start-up menu (before 1.6.3) ignores your place\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eNo radar or map pages\u003c/td\u003e\n\u003ctd\u003eThey come from the built-in Orlando area or a location pack: make your place's area pages (Settings › Weather location › Make the area pages); without one the Rain Outlook page takes their place\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAn imported pack is not used\u003c/td\u003e\n\u003ctd\u003eIt is for another place, or damaged: the console checks every pack and then shows the place without the map and radar pages. Make the pages again\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eNo sound\u003c/td\u003e\n\u003ctd\u003eSound needs Jellymatic's console chip image 18.40 or 18.41\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eThe TV row is missing\u003c/td\u003e\n\u003ctd\u003eIt is hidden: Other firmware › Show hidden apps, or Chromatic Manager › Settings › Apps; or the start-up menu is older than 1.6\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eTV opens the weather but no channel list\u003c/td\u003e\n\u003ctd\u003eThat is \"Local Weather only\": choose \"Local Weather and your Jellyfin server's Live TV channels\" in Settings › Apps\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003ch2 id=\"h-live-tv-on-the-console\"\u003eLive TV on the console\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eProblem\u003c/th\u003e\n\u003cth\u003eTry\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eNo Live TV channels yet\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eThe server has no channels for this user: add the tuner (Settings › Live TV channels, or \u003ca href=\"#docs/Live-TV-setup.md\"\u003eLive TV set-up\u003c/a\u003e) and allow Live TV for the console's user\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eOnly the weather row, \"Try again\" and a reason\u003c/td\u003e\n\u003ctd\u003eThe server is off or unreachable, or Live TV failed: press \u003cstrong\u003eSelect\u003c/strong\u003e to find the server or sign in again\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eNo channels under the weather row\u003c/td\u003e\n\u003ctd\u003eIs the tuner there (\u003ccode\u003elivetv_tuner.py status\u003c/code\u003e)? Run \u003ccode\u003erefresh-guide --yes\u003c/code\u003e. Does the console's user have \u003cstrong\u003eAllow Live TV access\u003c/strong\u003e?\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eNo signal\u003c/strong\u003e on many channels\u003c/td\u003e\n\u003ctd\u003eFree channels come and go. Build your list again; try \u003ccode\u003elivetv_tuner.py trial --yes\u003c/code\u003e to see that your server converts live channels at all\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eNo signal\u003c/strong\u003e after a few seconds every time\u003c/td\u003e\n\u003ctd\u003eThe stream limit is reached (another screen is watching a channel from this tuner), or the server cannot convert: check Dashboard › Playback › Transcoding and the server's log\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eThe server did not answer\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eLive channels can take a while to open on a slow server; try again; check the server's load\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePictures stop but sound goes on\u003c/td\u003e\n\u003ctd\u003eSome channels do this; after 20 seconds the console says No signal and returns to the list\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eA channel with the wrong language\u003c/td\u003e\n\u003ctd\u003eLeave it out with \u003ccode\u003e--exclude\u003c/code\u003e and build the list again\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003ch2 id=\"h-the-pc-tools\"\u003eThe PC tools\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMessage\u003c/th\u003e\n\u003cth\u003eMeans\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eFAIL no saved Jellyfin settings found\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eUse \u003ccode\u003e--ask-admin\u003c/code\u003e, or save \u003ccode\u003ejellyfin-connection.txt\u003c/code\u003e (see \u003ccode\u003ejellyfin-connection.example.txt\u003c/code\u003e)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eFAIL the Jellyfin sign-in was not accepted\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eWrong name or password, or the account is disabled. Nothing was changed\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eLive TV settings not readable\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eThe sign-in is not an administrator: use \u003ccode\u003e--ask-admin\u003c/code\u003e with an administrator\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ethe server does not list the channel list file at that path\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eThe path is the one your PC sees, not the server's, or the folder is not mounted into the Jellyfin container (\u003ca href=\"#docs/Live-TV-setup.md:4-put-the-list-where-the-server-can-read-it\"\u003eLive TV set-up\u003c/a\u003e)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ethe Chromavision tuner is already there\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eRemove it first (\u003ccode\u003eremove --yes\u003c/code\u003e) if you want to change its stream limit; to change channels just replace the file\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eFAIL ... settings differ\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eSomething else changed the Live TV settings meanwhile. The line says what to check; the backup is in your private folder\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eFAIL the list would be written inside the repository folder\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eChoose a folder outside the repository (lists stay out of Git)\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/FAQ.md\"\u003eFAQ\u003c/a\u003e\u003c/p\u003e"
},
{
"path":"docs/FAQ.md",
"title":"FAQ",
"html":"\u003ch1 id=\"h-faq\"\u003eFAQ\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › FAQ\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eIs this made by ModRetro, Analogue, Jellyfin, iptv-org or the National Weather Service?\u003c/strong\u003e No. Chromavision is an independent\nproject, not affiliated with any of them.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eDoes it cost anything?\u003c/strong\u003e No. It is free software (GPL-3.0-or-later), and it needs no account, key or subscription.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eDo I need a Jellyfin server?\u003c/strong\u003e Not for Local Weather. For live channels, yes: the console cannot decode the\nchannels' own video, so your server converts the one you watch.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eDo I need the PC while I watch?\u003c/strong\u003e No. The PC is for setting things up and undoing them.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eDoes it change my Jellyfin server?\u003c/strong\u003e Only if you add the Live TV tuner: one tuner, nothing else, with a backup, a\ndry run and proof afterwards (\u003ca href=\"#docs/Server-safety.md\"\u003eServer safety\u003c/a\u003e). It never signs out your other devices.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eIs it legal?\u003c/strong\u003e Chromavision lists only free channels that their broadcasters offer to the public, never pay-TV\nre-streams, and records nothing. The streams belong to their broadcasters, and some platforms' terms limit their\nfree channels to their own apps: that choice (\u003ccode\u003e--allow-redirects\u003c/code\u003e) is yours. The weather data is public domain.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eWhy does a channel say \"No signal\"?\u003c/strong\u003e Free channels come and go, and some run only part of the day. Build your\nlist again now and then.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eDoes TV write to my watch history?\u003c/strong\u003e No. Channels send no playback reports.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eCan I use it outside the US?\u003c/strong\u003e Local Weather: no, it uses the US National Weather Service. Live TV: the list\nbuilder takes \u003ccode\u003e--country\u003c/code\u003e and \u003ccode\u003e--language\u003c/code\u003e, but only US channels in English were tried.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eDoes it work on the Analogue Pocket?\u003c/strong\u003e Not in this version: TV and Local Weather are on the Chromatic only. The\nPocket link still works as before from the Jellyfin row.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eWhy is the picture small and soft?\u003c/strong\u003e The console's screen is 160 × 144; channels arrive at up to 160 × 120 and\nabout 400 kbit/s, which is what its Wi-Fi and decoder manage.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eIs the weather accurate?\u003c/strong\u003e It is the National Weather Service's own data, but shown for fun, refreshed only while\nthe channel is on screen, and shortened to fit: never use it for safety decisions.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eWho made the music and the voice?\u003c/strong\u003e The music and alert tone are written in code for this project. The announcer\nlines were made with Piper's \"Norman\" voice, trained only on public-domain recordings\n(\u003ca href=\"#docs/Credits-and-licences.md\"\u003eCredits \u0026amp; licences\u003c/a\u003e).\u003c/p\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/Building-and-testing.md\"\u003eBuilding and testing\u003c/a\u003e\u003c/p\u003e"
}
]

"html":"\u003ch1 id=\"h-building-and-testing\"\u003eBuilding and testing\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › Building and testing\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContents:\u003c/strong\u003e \u003ca href=\"#docs/Building-and-testing.md:where-the-code-is\"\u003eWhere the code is\u003c/a\u003e · \u003ca href=\"#docs/Building-and-testing.md:tests\"\u003eTests\u003c/a\u003e · \u003ca href=\"#docs/Building-and-testing.md:documentation\"\u003eDocumentation\u003c/a\u003e ·\n\u003ca href=\"#docs/Building-and-testing.md:rules-for-changes\"\u003eRules for changes\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"h-where-the-code-is\"\u003eWhere the code is\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eWhat\u003c/th\u003e\n\u003cth\u003eWhere\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003ePC tools\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003etools/\u003c/code\u003e here: \u003ccode\u003emake_channel_list.py\u003c/code\u003e, \u003ccode\u003elivetv_tuner.py\u003c/code\u003e, and \u003ccode\u003ejellyfin_admin.py\u003c/code\u003e, the small careful Jellyfin client they share with ChromaTube's tools\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eThe TV row, the channel list and tuning on the console\u003c/td\u003e\n\u003ctd\u003eJellymatic: \u003ccode\u003echromatic/jellyfin/\u003c/code\u003e (the Jellyfin app in its TV mode) and \u003ccode\u003echromatic/launcher/\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eThe Local Weather channel (pages, data reader, radar decoder, sound, location record)\u003c/td\u003e\n\u003ctd\u003eJellymatic: \u003ccode\u003echromatic/weather/\u003c/code\u003e and \u003ccode\u003echromatic/launcher/main/\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eThe weather location setting, location packs and the Apps switches\u003c/td\u003e\n\u003ctd\u003eJellymatic: Chromatic Manager (\u003ccode\u003escripts/\u003c/code\u003e); by hand, \u003ccode\u003escripts/make_location_pack.py\u003c/code\u003e makes a \u003ccode\u003e.pjlp\u003c/code\u003e location pack\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eThe TV icons\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eart/\u003c/code\u003e here (original pixel art; Jellymatic carries the same pixels in its launcher)\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eThe console code lives in \u003ca href=\"https://github.com/ChaoticSPARTAN1/Jellymatic\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eJellymatic\u003c/a\u003e because there is one start-up\nmenu image to build, install and review. Build it from there (Jellymatic's \"Building from source\").\u003c/p\u003e\n\u003ch2 id=\"h-tests\"\u003eTests\u003c/h2\u003e\n\u003cp\u003eStandard library only; no device, no internet (the fake Jellyfin server listens on 127.0.0.1):\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003epy -3 tools\\tests\\test_livetv_tuner.py\npy -3 tools\\tests\\test_make_channel_list.py\npy -3 tools\\tests\\test_private_files.py\npy -3 scripts\\test_docs_html.py\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003etest_livetv_tuner.py\u003c/code\u003e runs every command against a fake server that already holds someone else's tuner, guide\nsource, libraries, users and sessions, with failures injected (add refused, delete fails, no channels, wrong stream\nformat). It checks that only allow-listed requests are sent, nothing else is touched, nothing private is printed and\nonly the run's own session is ever signed out. \u003ccode\u003etest_make_channel_list.py\u003c/code\u003e checks every list rule on made-up data,\nthat no line can be injected from third-party names or addresses, and that a list is never written inside the\nrepository. \u003ccode\u003etest_private_files.py\u003c/code\u003e checks that backups are user-only on macOS/Linux.\u003c/p\u003e\n\u003ch2 id=\"h-documentation\"\u003eDocumentation\u003c/h2\u003e\n\u003cp\u003eAfter editing any page: \u003ccode\u003epy -3 scripts\\build_docs_html.py\u003c/code\u003e (writes \u003ccode\u003eOpen-Documentation.html\u003c/code\u003e and \u003ccode\u003edocs/index.html\u003c/code\u003e\nfor GitHub Pages), then \u003ccode\u003epy -3 scripts\\build_docs_pdf.py\u003c/code\u003e (the PDF guide; needs Chrome or Edge), then\n\u003ccode\u003epy -3 scripts\\test_docs_html.py\u003c/code\u003e. GitHub Pages: Settings › Pages, branch \u003ccode\u003emain\u003c/code\u003e, folder \u003ccode\u003e/docs\u003c/code\u003e.\u003c/p\u003e\n\u003ch2 id=\"h-rules-for-changes\"\u003eRules for changes\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eKeep the server rules of \u003ca href=\"#docs/Server-safety.md\"\u003eServer safety\u003c/a\u003e: add-only, backup, dry run, proof, allow-listed\nrequests, nothing private printed, never sign out another session.\u003c/li\u003e\n\u003cli\u003eNo channel lists, stream addresses, logos, recordings or anything personal in the repository.\u003c/li\u003e\n\u003cli\u003ePlain words in anything a user reads.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/Credits-and-licences.md\"\u003eCredits \u0026amp; licences\u003c/a\u003e\u003c/p\u003e"
},
{
"path":"docs/Credits-and-licences.md",
"title":"Credits \u0026 licences",
"html":"\u003ch1 id=\"h-credits--licences\"\u003eCredits \u0026amp; licences\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › Credits \u0026amp; licences\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContents:\u003c/strong\u003e \u003ca href=\"#docs/Credits-and-licences.md:author\"\u003eAuthor\u003c/a\u003e · \u003ca href=\"#docs/Credits-and-licences.md:this-projects-licence\"\u003eThis project's licence\u003c/a\u003e · \u003ca href=\"#docs/Credits-and-licences.md:data-and-sound\"\u003eData and sound\u003c/a\u003e ·\n\u003ca href=\"#docs/Credits-and-licences.md:included-here\"\u003eIncluded here\u003c/a\u003e · \u003ca href=\"#docs/Credits-and-licences.md:used-not-included\"\u003eUsed, not included\u003c/a\u003e · \u003ca href=\"#docs/Credits-and-licences.md:trademarks\"\u003eTrademarks\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"h-author\"\u003eAuthor\u003c/h2\u003e\n\u003cp\u003eCreated by \u003cstrong\u003eChaoticSPARTAN1\u003c/strong\u003e. Under GPLv3 section 7(b), redistributions and modified versions must keep this\nattribution in the README credits and in any About or credits screen (\u003ca href=\"#ADDITIONAL-TERMS.md\"\u003eADDITIONAL-TERMS.md\u003c/a\u003e).\u003c/p\u003e\n\u003ch2 id=\"h-this-projects-licence\"\u003eThis project's licence\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eGPL-3.0-or-later\u003c/strong\u003e (\u003ca href=\"LICENSE\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSE\u003c/a\u003e) for everything written for Chromavision: the PC tools, the docs, the\nbuild scripts and the icons. \u003ca href=\"#ADDITIONAL-TERMS.md\"\u003eADDITIONAL-TERMS.md\u003c/a\u003e adds the attribution term (7(b)) and the\nmarking of modified versions (7(c)), as in Jellymatic. The console code is part of Jellymatic, under Jellymatic's\nlicence and additional terms.\u003c/p\u003e\n\u003ch2 id=\"h-data-and-sound\"\u003eData and sound\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eWhat\u003c/th\u003e\n\u003cth\u003eFrom\u003c/th\u003e\n\u003cth\u003eLicence or terms\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eWeather observations, forecasts, alerts, radar pictures\u003c/td\u003e\n\u003ctd\u003eUS National Weather Service (\u003ccode\u003eapi.weather.gov\u003c/code\u003e, its map server)\u003c/td\u003e\n\u003ctd\u003eUS Government work, public domain. Not for safety decisions. Fetched by the console; nothing is stored here\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePlace look-up table used by Chromatic Manager\u003c/td\u003e\n\u003ctd\u003eUS Census Bureau, 2024 Gazetteer files (ZIP Code Tabulation Areas and places)\u003c/td\u003e\n\u003ctd\u003eUS Government work, public domain. Bundled with Jellymatic, not here\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eChannel data (channels, feeds, streams, blocklist)\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"https://github.com/iptv-org\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eiptv-org\u003c/a\u003e (\u003ccode\u003eiptv-org/iptv\u003c/code\u003e, \u003ccode\u003eiptv-org/api\u003c/code\u003e)\u003c/td\u003e\n\u003ctd\u003eThe Unlicense. Read at run time by \u003ccode\u003emake_channel_list.py\u003c/code\u003e; nothing of it is stored here. \u003cstrong\u003eEach stream belongs to its broadcaster\u003c/strong\u003e; pay-TV re-streams are left out on purpose\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAnnouncer lines of Local Weather\u003c/td\u003e\n\u003ctd\u003eMade with Piper (\u003ccode\u003eOHF-Voice/piper1-gpl\u003c/code\u003e) and its voice \u003ccode\u003een_US-norman-medium\u003c/code\u003e (rhasspy/piper-voices)\u003c/td\u003e\n\u003ctd\u003ePiper is GPL-3.0 and is not included. The Norman voice is listed as public domain, trained from scratch on public-domain LibriVox recordings. The wording is the project's own. The clips are in Jellymatic's start-up menu\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eMusic loop and alert tone\u003c/td\u003e\n\u003ctd\u003eWritten in code for this project\u003c/td\u003e\n\u003ctd\u003ePart of Jellymatic (GPL-3.0-or-later)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eRetro look\u003c/td\u003e\n\u003ctd\u003eOriginal art, colours and fonts of this project\u003c/td\u003e\n\u003ctd\u003eNo third-party weather-channel name, logo, artwork, music or data is used\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003ch2 id=\"h-included-here\"\u003eIncluded here\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003ePart\u003c/th\u003e\n\u003cth\u003eWhere\u003c/th\u003e\n\u003cth\u003eLicence\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003ePress Start 2P font (CodeMan38)\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003edocs/fonts/\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eSIL OFL 1.1, \u003ca href=\"LICENSES/OFL-1.1-PressStart2P.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSES/OFL-1.1-PressStart2P.txt\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSilkscreen font (The Silkscreen Project Authors)\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003edocs/fonts/\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eSIL OFL 1.1, \u003ca href=\"LICENSES/OFL-1.1-Silkscreen.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSES/OFL-1.1-Silkscreen.txt\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003ch2 id=\"h-used-not-included\"\u003eUsed, not included\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eTool\u003c/th\u003e\n\u003cth\u003eLicence\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eJellyfin server (its Live TV and FFmpeg-based conversion)\u003c/td\u003e\n\u003ctd\u003eGPL-2.0; the Jellyfin logo is CC BY-SA 4.0. Used through its public web API; no Jellyfin code is here\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePython\u003c/td\u003e\n\u003ctd\u003ePSF licence\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eJellymatic (the start-up menu and Chromatic Manager)\u003c/td\u003e\n\u003ctd\u003eGPL-3.0-or-later with its additional terms\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003ch2 id=\"h-trademarks\"\u003eTrademarks\u003c/h2\u003e\n\u003cp\u003eModRetro and Chromatic are trademarks of ModRetro, Inc. Analogue and Pocket are trademarks of Analogue. Jellyfin\nis a trademark of its owners. Channel names and logos belong to their owners. They are used only to say what Chromavision works with. Chromavision is an\nindependent project, not affiliated with, endorsed or supported by any of them, by iptv-org or by the US National\nWeather Service.\u003c/p\u003e"
},

"path":"CONTRIBUTING.md",
"title":"Contributing",
"html":"\u003ch1 id=\"h-contributing-to-chromavision\"\u003eContributing to Chromavision\u003c/h1\u003e\n\u003cp\u003ePull requests, bug fixes and bug reports are welcome. This is a hobby project: there is no guarantee of a response\nor a fix, but every report is read when time allows.\u003c/p\u003e\n\u003ch2 id=\"h-reporting-a-bug\"\u003eReporting a bug\u003c/h2\u003e\n\u003cp\u003eOpen an issue with what you did, what you expected and what happened; the start-up menu version (its credits screen\nor Chromatic Manager), the Jellyfin server version, and the tool's PASS/FAIL lines (they hold no private details).\nNever post server addresses, tokens, your channel list or your weather location. Security problems:\n\u003ca href=\"#SECURITY.md\"\u003eSECURITY.md\u003c/a\u003e. Problems with the console's TV row or Local Weather screens belong to\n\u003ca href=\"https://github.com/ChaoticSPARTAN1/Jellymatic\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eJellymatic\u003c/a\u003e.\u003c/p\u003e\n\u003ch2 id=\"h-pull-requests\"\u003ePull requests\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eKeep the server rules (\u003ca href=\"#docs/Server-safety.md\"\u003edocs/Server-safety.md\u003c/a\u003e): add-only, backup, dry run, proof,\nallow-listed requests, nothing private printed, never sign out another session or device.\u003c/li\u003e\n\u003cli\u003eNever add channel lists, stream addresses, logos or recordings to the repository.\u003c/li\u003e\n\u003cli\u003eRun the tests (\u003ccode\u003etools/tests/\u003c/code\u003e, \u003ccode\u003escripts/test_docs_html.py\u003c/code\u003e) and say which ones you ran. Tests must never contact a\nreal server or device.\u003c/li\u003e\n\u003cli\u003eAfter editing any documentation page, run \u003ccode\u003epy -3 scripts\\build_docs_html.py\u003c/code\u003e and \u003ccode\u003epy -3 scripts\\build_docs_pdf.py\u003c/code\u003e;\n\u003ccode\u003escripts\\test_docs_html.py\u003c/code\u003e checks the results.\u003c/li\u003e\n\u003cli\u003ePlain words in anything a user reads.\u003c/li\u003e\n\u003cli\u003eBy contributing you agree that your contribution is licensed under GPL-3.0-or-later with the additional terms in\n\u003ca href=\"#ADDITIONAL-TERMS.md\"\u003eADDITIONAL-TERMS.md\u003c/a\u003e.\u003c/li\u003e\n\u003c/ul\u003e"
},
{
"path":"SECURITY.md",
"title":"Security",
"html":"\u003ch1 id=\"h-security\"\u003eSecurity\u003c/h1\u003e\n\u003ch2 id=\"h-reporting-a-vulnerability\"\u003eReporting a vulnerability\u003c/h2\u003e\n\u003cp\u003ePlease report security problems \u003cstrong\u003eprivately\u003c/strong\u003e, not in a public issue: use GitHub's \u003cstrong\u003eSecurity › Report a\nvulnerability\u003c/strong\u003e (private vulnerability reporting) on this repository. Describe the problem, how to reproduce it and\nwhat it affects (the PC tools, the Jellyfin server, the console). There is no guarantee of a response time; reports are\nhandled as time allows. Problems in the console code belong to \u003ca href=\"https://github.com/ChaoticSPARTAN1/Jellymatic\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eJellymatic\u003c/a\u003e.\u003c/p\u003e\n\u003ch2 id=\"h-never-post-publicly\"\u003eNever post publicly\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eJellyfin server addresses, user names, user IDs, tokens, device IDs, Quick Connect codes\u003c/li\u003e\n\u003cli\u003eYour channel list, server paths, your weather location or ZIP code\u003c/li\u003e\n\u003cli\u003eThe files in your private folder (\u003ccode\u003e%LOCALAPPDATA%\\Chromavision\u003c/code\u003e): backups, the tuner record, your list\u003c/li\u003e\n\u003cli\u003eLogs or screenshots that show any of the above\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"h-what-chromavision-does-to-protect-you\"\u003eWhat Chromavision does to protect you\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eThe tools print counts and PASS/FAIL lines only, never addresses, paths, names, tokens or ids.\u003c/li\u003e\n\u003cli\u003eAn administrator sign-in is typed for one run (\u003ccode\u003e--ask-admin\u003c/code\u003e), kept in memory, never saved, and that run's own\nsession is signed out at the end. No other session or device is ever signed out.\u003c/li\u003e\n\u003cli\u003eEvery request that could change the server is checked against a short allow-list before it is sent.\u003c/li\u003e\n\u003cli\u003eNo redirect is followed and no proxy is taken from the environment, so a token only ever goes to your server.\u003c/li\u003e\n\u003cli\u003eChannel lists are written outside the repository; \u003ccode\u003e.gitignore\u003c/code\u003e keeps \u003ccode\u003e*.m3u\u003c/code\u003e and private files out of Git.\u003c/li\u003e\n\u003cli\u003eKeep Jellyfin on your home network: Chromavision never needs it to be reachable from the internet.\u003c/li\u003e\n\u003c/ul\u003e"
},

"path":"THIRD-PARTY-NOTICES.md",
"title":"Third-party notices",
"html":"\u003ch1 id=\"h-third-party-notices\"\u003eThird-party notices\u003c/h1\u003e\n\u003ch2 id=\"h-included-in-this-repository\"\u003eIncluded in this repository\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eComponent\u003c/th\u003e\n\u003cth\u003eFiles here\u003c/th\u003e\n\u003cth\u003eLicence\u003c/th\u003e\n\u003cth\u003eLicence text\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003ePress Start 2P (CodeMan38)\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003edocs/fonts/heading-PressStart2P-Regular.ttf\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eSIL OFL 1.1\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"LICENSES/OFL-1.1-PressStart2P.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSES/OFL-1.1-PressStart2P.txt\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSilkscreen (The Silkscreen Project Authors)\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003edocs/fonts/body-Silkscreen-Regular.ttf\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eSIL OFL 1.1\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"LICENSES/OFL-1.1-Silkscreen.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSES/OFL-1.1-Silkscreen.txt\u003c/a\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eEverything else here is Chromavision's own (GPL-3.0-or-later with \u003ca href=\"#ADDITIONAL-TERMS.md\"\u003eADDITIONAL-TERMS.md\u003c/a\u003e).\u003c/p\u003e\n\u003ch2 id=\"h-data-read-at-run-time-not-included\"\u003eData read at run time (not included)\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eSource\u003c/th\u003e\n\u003cth\u003eUsed by\u003c/th\u003e\n\u003cth\u003eLicence or terms\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eiptv-org: \u003ca href=\"https://github.com/iptv-org/iptv\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eiptv-org/iptv\u003c/a\u003e and \u003ca href=\"https://github.com/iptv-org/api\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eiptv-org/api\u003c/a\u003e (channels, feeds, streams, blocklist)\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003etools/make_channel_list.py\u003c/code\u003e, on your PC; \u003ccode\u003elivetv_tuner.py trial\u003c/code\u003e reads a small list you built with \u003ccode\u003emake_channel_list.py\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ca href=\"https://github.com/iptv-org/iptv/blob/master/LICENSE\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eThe Unlicense\u003c/a\u003e. The list data is public domain; \u003cstrong\u003ethe rights to each stream belong to its broadcaster\u003c/strong\u003e. iptv-org hosts no video. Pay-TV re-streams are never offered by the tools\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eUS National Weather Service: \u003ccode\u003eapi.weather.gov\u003c/code\u003e and its map server\u003c/td\u003e\n\u003ctd\u003ethe console's Local Weather channel (code in Jellymatic)\u003c/td\u003e\n\u003ctd\u003eUS Government work, public domain (\u003ca href=\"https://www.weather.gov/disclaimer\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eweather.gov/disclaimer\u003c/a\u003e). Asked with a plain program name, nothing personal. Not for safety decisions\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epool.ntp.org\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003ethe console's clock while Local Weather is on screen\u003c/td\u003e\n\u003ctd\u003ePublic time service\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003ch2 id=\"h-in-jellymatics-start-up-menu-not-included-here\"\u003eIn Jellymatic's start-up menu (not included here)\u003c/h2\u003e\n\u003cp\u003eThe console side of Chromavision is built into Jellymatic's start-up menu, which carries these and their notices:\u003c/p\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eComponent\u003c/th\u003e\n\u003cth\u003eLicence\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eLocal Weather announcer lines, made with \u003ca href=\"https://github.com/OHF-Voice/piper1-gpl\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ePiper\u003c/a\u003e (GPL-3.0; the tool is not distributed, only the five short clips it spoke) and its voice \u003ccode\u003een_US-norman-medium\u003c/code\u003e from \u003ca href=\"https://huggingface.co/rhasspy/piper-voices\" target=\"_blank\" rel=\"noopener noreferrer\"\u003erhasspy/piper-voices\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eThe voice's model card lists it as public domain, trained from scratch on public-domain LibriVox recordings. The wording is the project's own\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eMusic loop and alert tone\u003c/td\u003e\n\u003ctd\u003eWritten in code for the project (GPL-3.0-or-later, Jellymatic)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePlace look-up table for the weather location (Chromatic Manager)\u003c/td\u003e\n\u003ctd\u003eUS Census Bureau 2024 Gazetteer files, US Government work, public domain\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eESP-IDF, Mbed TLS, the root certificate bundle and the other firmware components\u003c/td\u003e\n\u003ctd\u003eApache-2.0, MPL-2.0 and others; see Jellymatic's THIRD-PARTY-NOTICES.md\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003ch2 id=\"h-used-through-its-public-interface-not-included\"\u003eUsed through its public interface (not included)\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eComponent\u003c/th\u003e\n\u003cth\u003eLicence\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eJellyfin server, its Live TV feature and its FFmpeg-based conversion\u003c/td\u003e\n\u003ctd\u003eGPL-2.0 (server); the Jellyfin logo is CC BY-SA 4.0. Chromavision contains no Jellyfin code and does not show the Jellyfin logo\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePython\u003c/td\u003e\n\u003ctd\u003ePSF licence\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e"
},

<script>
(function () {
  var data = JSON.parse(document.getElementById('docs-data').textContent);
  var pages = {}, order = [];
  data.groups.forEach(function (g) { g.pages.forEach(function (p) { p.group = g.name; pages[p.path] = p; order.push(p.path); }); });
  var current = null;
  function el(id) { return document.getElementById(id); }
  function link(text, hash, cls) {
    var a = document.createElement('a'); a.textContent = text; a.href = '#' + hash; if (cls) a.className = cls; return a;
  }
  function parse() {
    var h = location.hash.slice(1);
    try { h = decodeURIComponent(h); } catch (e) {}
    var cut = h.indexOf(':'), path = cut < 0 ? h : h.slice(0, cut), anchor = cut < 0 ? '' : h.slice(cut + 1);
    if (!pages[path]) { path = order[0]; anchor = ''; }
    return { path: path, anchor: anchor };
  }
  function nav(page) {
    var tabs = el('tabs'), list = el('pages');
    tabs.textContent = ''; list.textContent = '';
    data.groups.forEach(function (g) {
      tabs.appendChild(link(g.name, g.pages[0].path, g.name === page.group ? 'on' : ''));
      if (data.theme === 'chroma' && g.name !== page.group) return;
      var head = document.createElement('div'); head.className = 'group'; head.textContent = g.name; list.appendChild(head);
      g.pages.forEach(function (p) { list.appendChild(link(p.title, p.path, p.path === page.path ? 'on' : '')); });
    });
  }
  function show() {
    var where = parse(), page = pages[where.path];
    if (current !== page) {
      el('page').innerHTML = page.html;
      el('title').textContent = page.title;
      el('crumb').textContent = data.project + ' / ' + page.path;
      document.title = page.title + ' \u00b7 ' + data.project + ' documentation';
      nav(page);
      current = page;
    }
    var target = where.anchor && document.getElementById('h-' + where.anchor.toLowerCase());
    if (target) target.scrollIntoView(); else window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', show);
  show();
})();
</script>
