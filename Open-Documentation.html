"title":"Start here",
"html":"\u003cp align=\"center\"\u003e\n  \u003cimg src=\"docs/images/readme/chromavision-banner.png\" width=\"100%\" alt=\"Chromavision: TV channels on your ModRetro Chromatic. A pixel-art Chromatic handheld showing a rainbow test-card TV icon, next to the words Local Weather + Live TV\"\u003e\n\u003c/p\u003e\n\u003cp align=\"center\"\u003e\n  The \u003cb\u003eTV\u003c/b\u003e row of the Chromatic's start-up menu: a retro \u003cb\u003eLocal Weather\u003c/b\u003e channel drawn on the console,\n  and, if you want it, \u003cb\u003elive TV channels\u003c/b\u003e through your own Jellyfin server.\n\u003c/p\u003e\n\u003cp align=\"center\"\u003e\n  \u003cb\u003eRead the guide online:\u003c/b\u003e \u003ca href=\"https://chaoticspartan1.github.io/Chromavision/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003echaoticspartan1.github.io/Chromavision\u003c/a\u003e,\n  as a PDF: \u003ca href=\"docs/Chromavision-Guide.pdf\" target=\"_blank\" rel=\"noopener noreferrer\"\u003edocs/Chromavision-Guide.pdf\u003c/a\u003e (opens right on GitHub),\n  or offline: download and double-click \u003ccode\u003eOpen-Documentation.html\u003c/code\u003e.\n\u003c/p\u003e\n\u003ch2 id=\"h-safety\"\u003eSafety\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eChromavision is an independent project, not affiliated with ModRetro, Analogue, the Jellyfin project,\niptv-org or the US National Weather Service.\u003c/strong\u003e It is not made, endorsed or supported by any of them. \"ModRetro\"\nand \"Chromatic\" are trademarks of ModRetro, Inc.; \"Analogue\" and \"Pocket\" are trademarks of Analogue;\n\"Jellyfin\" is a trademark of its owners; they are used here only\nto say what this project works with. \u003cstrong\u003eUse it at your own risk.\u003c/strong\u003e Support is not guaranteed.\u003c/p\u003e\n\u003cp\u003eChromavision hosts \u003cstrong\u003eno video and no stream addresses\u003c/strong\u003e. Every channel belongs to its broadcaster. The weather\nis for fun: \u003cstrong\u003enever use it for safety decisions\u003c/strong\u003e; follow official warnings.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch2 id=\"h-what-it-is\"\u003eWhat it is\u003c/h2\u003e\n\u003cp\u003eChromavision is a separate app with its own row, \u003cstrong\u003eTV\u003c/strong\u003e, on the start-up menu of\n\u003ca href=\"https://github.com/ChaoticSPARTAN1/Jellymatic\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eJellymatic\u003c/a\u003e. It is built into Jellymatic's start-up menu, so you\ninstall it with \u003cstrong\u003eChromatic Manager\u003c/strong\u003e; this repository holds its guide and the PC tools for the optional Live TV part.\u003c/p\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003ePart\u003c/th\u003e\n\u003cth\u003eWhat it does\u003c/th\u003e\n\u003cth\u003eNeeds\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eLocal Weather\u003c/strong\u003e (on by default)\u003c/td\u003e\n\u003ctd\u003eAn early-1990s cable-style local forecast loop drawn on the console: current conditions, latest observations, almanac, local and extended forecast, rain outlook or radar, with music and an announcer.\u003c/td\u003e\n\u003ctd\u003eThe console's Wi-Fi and the internet. \u003cstrong\u003eNo Jellyfin server.\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eLive TV\u003c/strong\u003e (optional)\u003c/td\u003e\n\u003ctd\u003eFree, official live channels you choose, converted by your Jellyfin server's Live TV into the small picture and sound the Chromatic plays.\u003c/td\u003e\n\u003ctd\u003eYour Jellyfin server, set up once with Chromatic Manager (Settings › Live TV channels) or the tools here.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003ePC tools\u003c/strong\u003e (this repository)\u003c/td\u003e\n\u003ctd\u003eBuild your own channel list, add or remove the one Live TV tuner safely, check the server, test that a channel plays in the console's format.\u003c/td\u003e\n\u003ctd\u003ePython 3.10+ on a PC on the same network.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp align=\"center\"\u003e\n  \u003cimg src=\"docs/images/menu-tv.png\" width=\"320\" alt=\"The start-up menu with TV highlighted\"\u003e\n  \u003cimg src=\"docs/images/weather-current.png\" width=\"320\" alt=\"Local Weather: current conditions in Orlando, FL (sample data)\"\u003e\n  \u003cimg src=\"docs/images/tv-channel-list.png\" width=\"320\" alt=\"The TV channel list (sample names)\"\u003e\n\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eAll pictures are drawn by the project's own preview renderers with made-up sample data.\u003c/em\u003e\u003c/p\u003e\n\u003ch2 id=\"h-what-you-need\"\u003eWhat you need\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eA ModRetro Chromatic with Jellymatic's start-up menu \u003cstrong\u003e1.6.5 or newer\u003c/strong\u003e and its Wi-Fi set up\n(\u003ca href=\"https://chaoticspartan1.github.io/Jellymatic/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eJellymatic guide\u003c/a\u003e). Sound needs Jellymatic's sound or Pocket link\nconsole chip image (18.40 / 18.41).\u003c/li\u003e\n\u003cli\u003eFor \u003cstrong\u003eLive TV\u003c/strong\u003e only: a Jellyfin server (10.9 or newer) on your home network that can convert video (its\nnormal FFmpeg), a \u003cstrong\u003enormal, non-administrator\u003c/strong\u003e Jellyfin user for the console with Live TV allowed, and an\nadministrator sign-in used \u003cstrong\u003eonce, on the PC\u003c/strong\u003e, to add the tuner. Details: \u003ca href=\"#docs/What-you-need.md\"\u003eWhat you need\u003c/a\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"h-quick-start-plain-english\"\u003eQuick start (plain English)\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eLocal Weather:\u003c/strong\u003e install or update Jellymatic's start-up menu with Chromatic Manager and choose \u003cstrong\u003eTV\u003c/strong\u003e on the\nstart-up menu: it opens straight to Local Weather (Orlando, FL until you choose your place in Chromatic Manager:\n\u003cstrong\u003eSettings › Weather location\u003c/strong\u003e). \u003ca href=\"#docs/Local-Weather.md\"\u003eLocal Weather\u003c/a\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eLive TV (optional):\u003c/strong\u003e easiest in Chromatic Manager: \u003cstrong\u003eSettings › Live TV channels\u003c/strong\u003e (dry run, then Add), then\n\u003cstrong\u003eSettings › Apps\u003c/strong\u003e › \"Local Weather and your Jellyfin server's Live TV channels\". Or by hand: build your channel list\n(\u003ccode\u003epy -3 tools\\make_channel_list.py --group weather --group animation\u003c/code\u003e), put it where your Jellyfin server can\nread it, then check and add the tuner with a dry run first\n(\u003ccode\u003epy -3 tools\\livetv_tuner.py add --server-path \u0026lt;the list as the server sees it\u0026gt; --ask-admin\u003c/code\u003e, then the same\nwith \u003ccode\u003e--yes\u003c/code\u003e). Step by step: \u003ca href=\"#docs/Live-TV-setup.md\"\u003eLive TV set-up\u003c/a\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eWatch:\u003c/strong\u003e start-up menu › \u003cstrong\u003eTV\u003c/strong\u003e › a channel › \u003cstrong\u003eA\u003c/strong\u003e. Up/Down change channel; \u003cstrong\u003eB\u003c/strong\u003e goes back\n(\u003ca href=\"#docs/Using-TV.md\"\u003eUsing TV\u003c/a\u003e).\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"h-your-jellyfin-server-stays-yours\"\u003eYour Jellyfin server stays yours\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eAdd-only:\u003c/strong\u003e one tuner, nothing else. No library, user, device, plugin, task or conversion setting is changed,\nand the tools prove it after every step.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBackup and dry run first:\u003c/strong\u003e the Live TV settings are saved before any change; every change is shown in full\nand sent only with \u003ccode\u003e--yes\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eLimited:\u003c/strong\u003e at most 1 channel (or 2, if you choose) converted at once, so TV cannot overload the server.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eYour other devices are never signed out.\u003c/strong\u003e The tools sign out only their own one-run session.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePrivate:\u003c/strong\u003e your server address, sign-in and channel list stay on your PC and server; nothing is uploaded,\nand the tools print counts, never addresses or names. Keep Jellyfin off the internet.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eFull rules: \u003ca href=\"#docs/Server-safety.md\"\u003eServer safety\u003c/a\u003e.\u003c/p\u003e\n\u003ch2 id=\"h-undo-everything\"\u003eUndo everything\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003epy -3 tools\\livetv_tuner.py remove --yes\u003c/code\u003e deletes exactly the tuner it added and proves the Live TV settings\nequal the backup. Delete your list file. On the console, hide the TV row (Select on it, or Chromatic Manager › Settings ›\nApps), or remove the start-up menu altogether. \u003ca href=\"#docs/Undo-everything.md\"\u003eUndo everything\u003c/a\u003e.\u003c/p\u003e\n\u003ch2 id=\"h-documentation-wiki\"\u003eDocumentation (wiki)\u003c/h2\u003e\n\u003cp\u003eStart at \u003cstrong\u003e\u003ca href=\"#docs/Home.md\"\u003edocs/Home.md\u003c/a\u003e\u003c/strong\u003e. Pages: What you need · Local Weather · Live TV set-up · Choosing\nchannels · Using TV · Server safety · Undo everything · Troubleshooting · FAQ · Building and testing · Credits \u0026amp;\nlicences.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAs one PDF:\u003c/strong\u003e \u003ca href=\"docs/Chromavision-Guide.pdf\" target=\"_blank\" rel=\"noopener noreferrer\"\u003edocs/Chromavision-Guide.pdf\u003c/a\u003e. \u003cstrong\u003eOffline:\u003c/strong\u003e download or clone this\nrepository and double-click \u003cstrong\u003e\u003ccode\u003eOpen-Documentation.html\u003c/code\u003e\u003c/strong\u003e (keep it next to \u003ccode\u003edocs/\u003c/code\u003e). Both are built from the\nMarkdown pages by \u003ccode\u003escripts/build_docs_html.py\u003c/code\u003e and \u003ccode\u003escripts/build_docs_pdf.py\u003c/code\u003e.\u003c/p\u003e\n\u003ch2 id=\"h-what-is-in-this-repository\"\u003eWhat is in this repository\u003c/h2\u003e\n\u003cpre\u003e\u003ccode\u003etools/                  PC tools: make_channel_list.py, livetv_tuner.py, jellyfin_admin.py, tests/\ndocs/                   the guide (Markdown), pictures, fonts, GitHub Pages copy, PDF guide\nart/                    the TV row's icons (original pixel art)\nmedia/                  promo videos and a still picture\nscripts/                documentation builders and their test\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eNot in this repository:\u003c/strong\u003e the console code. The TV row, the Local Weather channel, its sound and pictures are\npart of Jellymatic's start-up menu (\u003ccode\u003echromatic/weather/\u003c/code\u003e, \u003ccode\u003echromatic/jellyfin/\u003c/code\u003e, \u003ccode\u003echromatic/launcher/\u003c/code\u003e in\n\u003ca href=\"https://github.com/ChaoticSPARTAN1/Jellymatic\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eJellymatic\u003c/a\u003e), so there is one start-up menu to install and review.\nAlso not here: any channel list, stream address, logo or recording, and anything personal. Your own files (backups,\nthe tuner record, your list) live in \u003ccode\u003e%LOCALAPPDATA%\\Chromavision\u003c/code\u003e and never in Git.\u003c/p\u003e\n\u003ch2 id=\"h-sibling-projects\"\u003eSibling projects\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/ChaoticSPARTAN1/Jellymatic\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eJellymatic\u003c/a\u003e: the Chromatic start-up menu, Jellyfin app and Chromatic Manager (Chromavision runs inside it).\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/ChaoticSPARTAN1/ChromaTube\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eChromaTube\u003c/a\u003e: the optional video-channel row, also through Jellyfin.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/ChaoticSPARTAN1/PocketFin\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ePocketFin\u003c/a\u003e: Jellyfin on the Analogue Pocket.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/ChaoticSPARTAN1/RemotePilot\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eRemotePilot\u003c/a\u003e: see and press the console's menus from your PC.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"h-licence\"\u003eLicence\u003c/h2\u003e\n\u003cp\u003eChromavision is free software: \u003cstrong\u003eGPL-3.0-or-later\u003c/strong\u003e (\u003ca href=\"LICENSE\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSE\u003c/a\u003e), with additional terms under GPLv3\nsection 7 (\u003ca href=\"#ADDITIONAL-TERMS.md\"\u003eADDITIONAL-TERMS.md\u003c/a\u003e): keep the author attribution \"ChaoticSPARTAN1\" (7(b)) and mark\nmodified versions as modified (7(c)). Parts made by others keep their own licences; see \u003ca href=\"NOTICE\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eNOTICE\u003c/a\u003e,\n\u003ca href=\"#THIRD-PARTY-NOTICES.md\"\u003eTHIRD-PARTY-NOTICES.md\u003c/a\u003e and \u003ca href=\"#docs/Credits-and-licences.md\"\u003eCredits \u0026amp; licences\u003c/a\u003e.\u003c/p\u003e\n\u003ch2 id=\"h-contributing-and-security\"\u003eContributing and security\u003c/h2\u003e\n\u003cp\u003ePull requests, bug fixes and bug reports are welcome: \u003ca href=\"#CONTRIBUTING.md\"\u003eCONTRIBUTING.md\u003c/a\u003e. To report a security\nproblem privately: \u003ca href=\"#SECURITY.md\"\u003eSECURITY.md\u003c/a\u003e. Never post server addresses, tokens, channel lists tied to you, your\nweather location or logs with addresses.\u003c/p\u003e\n\u003ch2 id=\"h-credits\"\u003eCredits\u003c/h2\u003e\n\u003cp\u003eCreated by \u003cstrong\u003eChaoticSPARTAN1\u003c/strong\u003e. Weather data from the US National Weather Service (public domain). Channel data from\n\u003ca href=\"https://github.com/iptv-org\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eiptv-org\u003c/a\u003e (The Unlicense; the streams belong to their broadcasters). Place look-up from\nthe US Census Bureau Gazetteer (public domain). Announcer lines made with Piper and its public-domain \"Norman\"\nvoice. Full list: \u003ca href=\"#docs/Credits-and-licences.md\"\u003eCredits \u0026amp; licences\u003c/a\u003e.\u003c/p\u003e"
},

"path":"docs/Home.md",
"title":"Wiki home",
"html":"\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/chromavision-icon.png\" width=\"140\" alt=\"Pixel TV with rabbit ears and a rainbow test card\"\u003e\u003c/p\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/chromavision-logo.png\" width=\"388\" alt=\"Chromavision\"\u003e\u003c/p\u003e\n\u003ch1 id=\"h-chromavision-wiki\"\u003eChromavision wiki\u003c/h1\u003e\n\u003cp\u003e\u003cstrong\u003eTV on your ModRetro Chromatic\u003c/strong\u003e: a retro Local Weather channel drawn on the console, and, if you want it, live\nchannels through your own Jellyfin server.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eRead it as one PDF:\u003c/strong\u003e \u003ca href=\"docs/Chromavision-Guide.pdf\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eChromavision-Guide.pdf\u003c/a\u003e (opens right on GitHub). \u003cstrong\u003eOr offline:\u003c/strong\u003e\ndownload or clone the repository, then double-click \u003ccode\u003eOpen-Documentation.html\u003c/code\u003e in its main folder.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eChromavision is an independent project, not affiliated with ModRetro, Analogue, the Jellyfin project, iptv-org\nor the US National Weather Service. Use it at your own risk; support is not guaranteed. The weather is for fun: never use it\nfor safety decisions.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch2 id=\"h-contents\"\u003eContents\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003ePage\u003c/th\u003e\n\u003cth\u003eRead it when\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/What-you-need.md\"\u003eWhat you need\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eBefore anything else\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Local-Weather.md\"\u003eLocal Weather\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eYou want the weather channel and your own location\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Live-TV-setup.md\"\u003eLive TV set-up\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eYou want live channels through your Jellyfin server\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Choosing-channels.md\"\u003eChoosing channels\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eYou build or change your channel list\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Using-TV.md\"\u003eUsing TV\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eButtons and what the screens say\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Server-safety.md\"\u003eServer safety\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eYou want to know exactly what the tools do to your server\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Undo-everything.md\"\u003eUndo everything\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eYou want it all gone\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Troubleshooting.md\"\u003eTroubleshooting\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eSomething does not work\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/FAQ.md\"\u003eFAQ\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eShort answers\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Building-and-testing.md\"\u003eBuilding and testing\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eYou change the tools or the docs\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Credits-and-licences.md\"\u003eCredits \u0026amp; licences\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eWho made what, and under which licence\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003ch2 id=\"h-in-one-picture\"\u003eIn one picture\u003c/h2\u003e\n\u003cpre\u003e\u003ccode\u003e Start-up menu ──► TV ──► Local Weather ........ drawn on the console from US weather data (the default; no server)\n                    └──► with Live TV: a list ── WX LOCAL WEATHER, then your channels, converted by your Jellyfin server\n\n PC (once): Chromatic Manager › Settings › Live TV channels   (or by hand: make_channel_list.py ──► livetv_tuner.py add)\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/menu-tv.png\" width=\"320\" alt=\"The start-up menu with TV highlighted\"\u003e\n\u003cimg src=\"docs/images/weather-opening.png\" width=\"320\" alt=\"The Local Weather opening card for Orlando, FL\"\u003e\u003c/p\u003e\n\u003cp\u003eThe TV row is part of \u003ca href=\"https://github.com/ChaoticSPARTAN1/Jellymatic\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eJellymatic\u003c/a\u003e's start-up menu: Chromatic\nManager installs it, and it can be hidden there (Settings › Apps) or on the console (Select on its row). This repository holds the guide and the PC\ntools for the optional Live TV part.\u003c/p\u003e"
},

"path":"docs/What-you-need.md",
"title":"What you need",
"html":"\u003ch1 id=\"h-what-you-need\"\u003eWhat you need\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › What you need\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContents:\u003c/strong\u003e \u003ca href=\"#docs/What-you-need.md:for-local-weather\"\u003eFor Local Weather\u003c/a\u003e · \u003ca href=\"#docs/What-you-need.md:for-live-tv\"\u003eFor Live TV\u003c/a\u003e · \u003ca href=\"#docs/What-you-need.md:not-needed\"\u003eNot needed\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"h-for-local-weather\"\u003eFor Local Weather\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eYou need\u003c/th\u003e\n\u003cth\u003eWhy\u003c/th\u003e\n\u003cth\u003eNotes\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eA \u003cstrong\u003eModRetro Chromatic\u003c/strong\u003e with Jellymatic's start-up menu \u003cstrong\u003e1.6.5 or newer\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eThe TV row is part of it\u003c/td\u003e\n\u003ctd\u003eInstall and update with Chromatic Manager: \u003ca href=\"https://chaoticspartan1.github.io/Jellymatic/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eJellymatic guide\u003c/a\u003e.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eThe console's \u003cstrong\u003eWi-Fi\u003c/strong\u003e set up, with internet access\u003c/td\u003e\n\u003ctd\u003eThe weather comes from the US National Weather Service over HTTPS\u003c/td\u003e\n\u003ctd\u003e2.4 GHz; set up on the console (Jellyfin › Select) or from Chromatic Manager.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eA place in the \u003cstrong\u003eUnited States\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eThe data is the US National Weather Service's\u003c/td\u003e\n\u003ctd\u003eUntil you choose one the channel shows Orlando, FL. Choose yours in Chromatic Manager: \u003cstrong\u003eSettings › Weather location\u003c/strong\u003e (\u003ca href=\"#docs/Local-Weather.md\"\u003eLocal Weather\u003c/a\u003e).\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eFor sound: Jellymatic's console chip image \u003cstrong\u003e18.40 or 18.41\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eThe console plays sound through it\u003c/td\u003e\n\u003ctd\u003eWithout it the channel is silent.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003ch2 id=\"h-for-live-tv\"\u003eFor Live TV\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eYou need\u003c/th\u003e\n\u003cth\u003eWhy\u003c/th\u003e\n\u003cth\u003eNotes\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eA \u003cstrong\u003eJellyfin server 10.9 or newer\u003c/strong\u003e on your \u003cstrong\u003ehome network\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eIt turns each channel into the small picture and sound the Chromatic plays\u003c/td\u003e\n\u003ctd\u003eKeep it off the internet (\u003ca href=\"#docs/Server-safety.md\"\u003eServer safety\u003c/a\u003e).\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eVideo conversion working on that server\u003c/td\u003e\n\u003ctd\u003eEvery watched channel is converted on the fly\u003c/td\u003e\n\u003ctd\u003eDashboard › Playback › Transcoding; the default settings are fine.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eA \u003cstrong\u003enormal Jellyfin user for the console\u003c/strong\u003e, not an administrator, with \u003cstrong\u003eAllow Live TV access\u003c/strong\u003e on\u003c/td\u003e\n\u003ctd\u003eThe console signs in as this user\u003c/td\u003e\n\u003ctd\u003eDashboard › Users › that user › Live TV access. Approve the console's Quick Connect code while signed in as this user.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAn \u003cstrong\u003eadministrator\u003c/strong\u003e name and password, \u003cstrong\u003etyped once on the PC\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eOnly an administrator may add a tuner\u003c/td\u003e\n\u003ctd\u003eChromatic Manager and the tools ask for it for one job, keep it in memory only and sign that job's session out at the end.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eA \u003cstrong\u003ePC\u003c/strong\u003e on the same network with \u003cstrong\u003ePython 3.10 or newer\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eRuns the tools in \u003ccode\u003etools/\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eStandard library only: nothing to install with pip. Windows, macOS or Linux.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eA place the \u003cstrong\u003eserver can read\u003c/strong\u003e your channel list file\u003c/td\u003e\n\u003ctd\u003eThe tuner reads the list from a file\u003c/td\u003e\n\u003ctd\u003eFor example Jellyfin's own configuration folder (\u003ca href=\"#docs/Live-TV-setup.md:4-put-the-list-where-the-server-can-read-it\"\u003eLive TV set-up\u003c/a\u003e).\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eInternet access on the server\u003c/td\u003e\n\u003ctd\u003eThe channels are streamed from their broadcasters\u003c/td\u003e\n\u003ctd\u003eEach watched channel is one stream from the internet to your server.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003ch2 id=\"h-not-needed\"\u003eNot needed\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eNo account anywhere, no API key, no paid service, no plugin and no server restart.\u003c/li\u003e\n\u003cli\u003eNo PC running while you watch: after set-up the console talks to your Jellyfin server directly.\u003c/li\u003e\n\u003cli\u003eNo channel list from anyone else: you build your own from public data, and it stays on your machines.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/Local-Weather.md\"\u003eLocal Weather\u003c/a\u003e\u003c/p\u003e"
}
]

"html":"\u003ch1 id=\"h-local-weather\"\u003eLocal Weather\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › Local Weather\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContents:\u003c/strong\u003e \u003ca href=\"#docs/Local-Weather.md:what-it-is\"\u003eWhat it is\u003c/a\u003e · \u003ca href=\"#docs/Local-Weather.md:open-it\"\u003eOpen it\u003c/a\u003e · \u003ca href=\"#docs/Local-Weather.md:the-pages\"\u003eThe pages\u003c/a\u003e ·\n\u003ca href=\"#docs/Local-Weather.md:choose-your-location\"\u003eChoose your location\u003c/a\u003e · \u003ca href=\"#docs/Local-Weather.md:your-areas-map-and-radar-pages-a-location-pack\"\u003eLocation packs\u003c/a\u003e · \u003ca href=\"#docs/Local-Weather.md:sound\"\u003eSound\u003c/a\u003e · \u003ca href=\"#docs/Local-Weather.md:where-the-data-comes-from\"\u003eWhere the data comes from\u003c/a\u003e ·\n\u003ca href=\"#docs/Local-Weather.md:privacy\"\u003ePrivacy\u003c/a\u003e · \u003ca href=\"#docs/Local-Weather.md:limits\"\u003eLimits\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"h-what-it-is\"\u003eWhat it is\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eLocal Weather\u003c/strong\u003e (shown as \u003cstrong\u003eWX LOCAL WEATHER\u003c/strong\u003e) is a channel drawn by the console itself: an\nearly-1990s cable-style \"local forecast\" loop at 160 × 144 pixels, with our own art, fonts, music and announcer.\nIt needs Wi-Fi and the internet, \u003cstrong\u003enot\u003c/strong\u003e a Jellyfin server, so it works even when your server is off.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eFor fun only. \u003cstrong\u003eNever use it for safety decisions\u003c/strong\u003e: follow official warnings from the National Weather\nService and your local authorities.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/weather-opening.png\" width=\"320\" alt=\"Opening card: Orlando, FL\"\u003e\n\u003cimg src=\"docs/images/weather-current.png\" width=\"320\" alt=\"Current conditions in Orlando (sample data)\"\u003e\n\u003cimg src=\"docs/images/weather-extended.png\" width=\"320\" alt=\"Extended forecast (sample data)\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eThe pictures show the built-in example place, Orlando, FL, drawn by the project's preview renderer from a\nrecorded set of weather replies.\u003c/em\u003e\u003c/p\u003e\n\u003ch2 id=\"h-open-it\"\u003eOpen it\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eTV with Local Weather only\u003c/strong\u003e (the default): start-up menu › \u003cstrong\u003eTV\u003c/strong\u003e › \u003cstrong\u003eA\u003c/strong\u003e opens Local Weather straight away, once\nWi-Fi has joined. No Jellyfin server or sign-in is needed. \u003cstrong\u003eB\u003c/strong\u003e returns to the start-up menu.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eTV with Live TV channels\u003c/strong\u003e (Chromatic Manager › Settings › Apps): \u003cstrong\u003eTV\u003c/strong\u003e opens the channel list; \u003cstrong\u003eWX LOCAL\nWEATHER\u003c/strong\u003e is its first row. There \u003cstrong\u003eB\u003c/strong\u003e returns to the list and \u003cstrong\u003eUp\u003c/strong\u003e / \u003cstrong\u003eDown\u003c/strong\u003e go to the first / last TV channel.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eThe pages turn by themselves (about 8 seconds each); a banner shows the keys for 3 seconds. If the channel cannot\nopen, the screen says \u003cstrong\u003eLocal Weather did not open\u003c/strong\u003e with the reason; \u003cstrong\u003eB\u003c/strong\u003e returns.\u003c/p\u003e\n\u003cp\u003eThe first time, the pages show \u003ccode\u003e--\u003c/code\u003e and \u003cstrong\u003eUPDATING\u003c/strong\u003e while the data arrives (a second or two on a good network,\nlonger on a slow one). Values are kept until the console is switched off, so coming back is quicker.\u003c/p\u003e\n\u003ch2 id=\"h-the-pages\"\u003eThe pages\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003ePage\u003c/th\u003e\n\u003cth\u003eWhat it shows\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eOpening card\u003c/td\u003e\n\u003ctd\u003eThe channel badge, your place's name\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eCurrent Conditions (2 pages)\u003c/td\u003e\n\u003ctd\u003eTemperature, sky, wind, humidity, dew point, pressure, visibility, ceiling, feels-like\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eLatest Observations\u003c/td\u003e\n\u003ctd\u003eNearby weather stations: temperature, sky, wind\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eToday's Almanac\u003c/td\u003e\n\u003ctd\u003eSunrise, sunset, moon phase and the next four phases, worked out on the console\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eLocal Forecast\u003c/td\u003e\n\u003ctd\u003eThe forecast text, one page per period\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eExtended Forecast (2 pages)\u003c/td\u003e\n\u003ctd\u003eSix days: icon, high, low, chance of rain\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eRegional Forecast (2 pages)\u003c/td\u003e\n\u003ctd\u003eToday's highs on a state map and a close-up of the area, where offered (see \u003ca href=\"#docs/Local-Weather.md:limits\"\u003eLimits\u003c/a\u003e)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eCurrent Radar, or Rain Outlook\u003c/td\u003e\n\u003ctd\u003eThe radar picture with a light-to-heavy key where offered; otherwise the chance of rain for each coming period\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eA ticker at the bottom rolls through the latest figures. When the National Weather Service has an \u003cstrong\u003eactive alert\u003c/strong\u003e\nfor your place, the bar turns red, the headline crawls across it and an alert tone plays with the opening card.\u003c/p\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/weather-observations.png\" width=\"320\" alt=\"Latest observations around Orlando (sample data)\"\u003e\n\u003cimg src=\"docs/images/weather-regional.png\" width=\"320\" alt=\"Regional forecast: Florida (sample data)\"\u003e\n\u003cimg src=\"docs/images/weather-radar.png\" width=\"320\" alt=\"Current radar around Orlando (sample data)\"\u003e\u003c/p\u003e\n\u003cp\u003eAll pages of one loop, for Orlando, FL:\u003c/p\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/weather-contact-sheet.png\" width=\"100%\" alt=\"Every Local Weather page for Orlando, FL (sample data)\"\u003e\u003c/p\u003e\n\u003cp\u003eIf the console has no Wi-Fi yet, TV says so and offers to set it up right there:\u003c/p\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/tv-weather-no-wifi.png\" width=\"320\" alt=\"TV: Wi-Fi isn\u0026#x27;t set up yet. Select: set up Wi-Fi\"\u003e\u003c/p\u003e\n\u003ch2 id=\"h-choose-your-location\"\u003eChoose your location\u003c/h2\u003e\n\u003cp\u003eYour place is chosen on the PC, in \u003cstrong\u003eChromatic Manager\u003c/strong\u003e (part of Jellymatic), and written to the console:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eConnect the console with the USB cable, switch it on and open Chromatic Manager.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSettings › Weather location\u003c/strong\u003e. Type a US \u003cstrong\u003eZIP code\u003c/strong\u003e (for example \u003ccode\u003e32801\u003c/code\u003e) or \u003cstrong\u003eCity, ST\u003c/strong\u003e (for example\n\u003ccode\u003eOrlando, FL\u003c/code\u003e) and press \u003cstrong\u003eFind\u003c/strong\u003e. The match comes from a table on your PC: nothing is sent yet.\u003c/li\u003e\n\u003cli\u003eChoose the place. The Manager then asks the National Weather Service (and only it) for the forecast area, time\nzone and six nearest weather stations, and shows them.\u003c/li\u003e\n\u003cli\u003ePress \u003cstrong\u003eSave and write to console\u003c/strong\u003e and \u003cstrong\u003eApprove\u003c/strong\u003e. The place goes into two small records of its own on the\nconsole (your Wi-Fi and Jellyfin set-up are not touched), checked on the chip.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eUntil you choose a place the channel shows the built-in default, \u003cstrong\u003eOrlando, FL\u003c/strong\u003e. \u003cstrong\u003eUse default (Orlando, FL)\u003c/strong\u003e erases\nyour place (and its area pages) again. Installing, updating or switching off the start-up menu keeps your place; removing the menu erases it\n(Chromatic Manager keeps its copy and writes it back at the next install).\u003c/p\u003e\n\u003ch3 id=\"h-your-areas-map-and-radar-pages-a-location-pack\"\u003eYour area's map and radar pages: a location pack\u003c/h3\u003e\n\u003cp\u003eOn its own, a place gets its conditions, forecasts, almanac and nearby stations, with a \u003cstrong\u003eRain Outlook\u003c/strong\u003e page where\nthe map and radar pages would be (a place in Florida keeps the built-in Florida map pages, and the radar near\nOrlando). For your own area's maps and radar, add its \u003cstrong\u003earea pages\u003c/strong\u003e, a \"location pack\" (start-up menu 1.6.5 or\nnewer):\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eIn \u003cstrong\u003eSettings › Weather location\u003c/strong\u003e, after choosing your place, press \u003cstrong\u003eMake the area pages\u003c/strong\u003e. Chromatic Manager asks\nthe National Weather Service about the towns near your place (about a minute; for the chosen area only) and makes a\nsmall pack (a few KB) with:\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eRegional Forecast\u003c/strong\u003e: your state's outline with today's highs for your place and up to five larger towns;\u003c/li\u003e\n\u003cli\u003ea \u003cstrong\u003eclose-up\u003c/strong\u003e of your area with nearby towns;\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCurrent Radar\u003c/strong\u003e: the nearest weather service radar, around your place, with town labels.\u003c/li\u003e\n\u003c/ul\u003e\u003c/li\u003e\n\u003cli\u003eA preview of every weather page, drawn by the console's own drawing code, appears in the window (hidden while\nprivate details are hidden; the figures show \u003ccode\u003e--\u003c/code\u003e until the console fetches them).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSave and write to console\u003c/strong\u003e, then \u003cstrong\u003eApprove\u003c/strong\u003e: the place and its pages are written together and checked. They\nstay through updates of the start-up menu; \u003cstrong\u003eUse default (Orlando, FL)\u003c/strong\u003e removes both.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/manager-location-pack.png\" width=\"600\" alt=\"Chromatic Manager: Weather location with the area pages made (example place: Denver, CO)\"\u003e\u003c/p\u003e\n\u003cp\u003eThe pages a pack gives Orlando, FL (the built-in place, made here by the tool as an example; the figures appear when\nthe console fetches them):\u003c/p\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/location-pack-contact-sheet.png\" width=\"100%\" alt=\"Every Local Weather page from a location pack for Orlando, FL, before the first fetch\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSharing pack files.\u003c/strong\u003e \u003cstrong\u003eExport pages...\u003c/strong\u003e saves the pack as a \u003ccode\u003e.pjlp\u003c/code\u003e file; \u003cstrong\u003eImport pages...\u003c/strong\u003e uses one, for the same\nplace only. A pack file names its place: share it only if you want to. Chromatic Manager and the console check every\npack in full and ignore a damaged one (the console then shows the place without the map and radar pages), but \u003cstrong\u003eonly\nimport packs from people you trust\u003c/strong\u003e. Without the window: \u003ccode\u003epy -3 scripts\\make_location_pack.py \"Orlando, FL\" orlando.pjlp\u003c/code\u003e\n(in Jellymatic's \u003ccode\u003escripts/\u003c/code\u003e) makes the same file (Python 3 and a connection to the US weather service only).\u003c/p\u003e\n\u003cp\u003eThe map pages are made by a program, not drawn by hand, so a crowded state can show fewer towns than Orlando's built-in\npages; town names and state outlines come from US Census Bureau data bundled with Jellymatic (public domain).\u003c/p\u003e\n\u003ch3 id=\"h-the-first-install-asks\"\u003eThe first install asks\u003c/h3\u003e\n\u003cp\u003eWhen Chromatic Manager installs the start-up menu on a console for the first time, it asks \u003cstrong\u003eAdd Local Weather?\u003c/strong\u003e\nbefore the install's \u003cstrong\u003eApprove\u003c/strong\u003e: \u003cstrong\u003eChoose my place...\u003c/strong\u003e (a ZIP code or \"City, ST\", then it offers to make the area\npages), \u003cstrong\u003eUse Orlando, FL\u003c/strong\u003e, or \u003cstrong\u003eSkip Local Weather\u003c/strong\u003e (the TV row stays hidden; turn it on any time in Settings ›\nApps). Your answer is written by that same install, which says what it will write first. Updates do not ask again.\u003c/p\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/manager-add-local-weather.png\" width=\"520\" alt=\"Add Local Weather? Choose my place, Use Orlando, FL, or Skip Local Weather\"\u003e\u003c/p\u003e\n\u003ch2 id=\"h-sound\"\u003eSound\u003c/h2\u003e\n\u003cp\u003eWith Jellymatic's sound or Pocket link console chip image (18.40 / 18.41), the channel plays a looping music\ntrack written for this project, an announcer line at the start of each section (\"Your current conditions.\",\n\"Your local forecast.\", \"Your extended forecast.\", \"Your regional forecast.\", \"Current radar.\") and the alert\ntone. The announcer lines were made with the open-source speech tool Piper and its \"Norman\" voice, which was\ntrained only on public-domain recordings (\u003ca href=\"#docs/Credits-and-licences.md\"\u003eCredits \u0026amp; licences\u003c/a\u003e). With the official console\nchip image the channel is silent.\u003c/p\u003e\n\u003ch2 id=\"h-where-the-data-comes-from\"\u003eWhere the data comes from\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eUS National Weather Service\u003c/strong\u003e, \u003ccode\u003ehttps://api.weather.gov\u003c/code\u003e: observations, forecasts, alerts. Free, no key, public\ndomain. The console identifies itself with a plain program name, nothing personal.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eRadar picture\u003c/strong\u003e, where offered: the National Weather Service's map server (\u003ccode\u003eopengeo.ncep.noaa.gov\u003c/code\u003e).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eClock\u003c/strong\u003e: the public time service \u003ccode\u003epool.ntp.org\u003c/code\u003e; if it does not answer, the time of the weather service's reply.\u003c/li\u003e\n\u003cli\u003eSun and moon times are worked out on the console, not fetched.\u003c/li\u003e\n\u003cli\u003eThe place look-up table, the state outlines and the town list for location packs come from the \u003cstrong\u003eUS Census Bureau\u003c/strong\u003e\n(2024 Gazetteer files and the 20M cartographic boundary file; public domain), bundled with Jellymatic: looking a\nplace up sends nothing anywhere.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"h-privacy\"\u003ePrivacy\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eYour place is kept \u003cstrong\u003eonly on your PC and your console\u003c/strong\u003e. It is sent only to the National Weather Service (as\nmap coordinates and the station and forecast-area codes of your place). Making area pages asks it about the chosen\narea only, and checks one radar picture on its map server.\u003c/li\u003e\n\u003cli\u003eA pack file (\u003ccode\u003e.pjlp\u003c/code\u003e) names its place: share it only if you want to, and import only packs you trust (every pack is\nchecked in full before use). It never goes into Git, logs or\nscreenshots: Chromatic Manager says \"your location\", never the place.\u003c/li\u003e\n\u003cli\u003eThe console checks the weather servers' certificates and names. It does not check certificate dates (it has no\nclock when it starts).\u003c/li\u003e\n\u003cli\u003eNothing about what you watch is sent anywhere.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"h-limits\"\u003eLimits\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eUS places only\u003c/strong\u003e (the National Weather Service covers the US and its territories).\u003c/li\u003e\n\u003cli\u003eThe \u003cstrong\u003eCurrent Radar\u003c/strong\u003e page and the two \u003cstrong\u003eRegional Forecast\u003c/strong\u003e maps come from the built-in Orlando area (a place in\nFlorida keeps the Florida maps and the radar near Orlando) or from your place's \u003cstrong\u003elocation pack\u003c/strong\u003e; for a place without\na pack the channel shows the \u003cstrong\u003eRain Outlook\u003c/strong\u003e page instead.\u003c/li\u003e\n\u003cli\u003eA location pack's maps are laid out by a program: a crowded state may show fewer towns than the built-in Orlando pages.\u003c/li\u003e\n\u003cli\u003eThe channel runs only while it is on screen; it is not refreshed in the background.\u003c/li\u003e\n\u003cli\u003eAn observation older than 4 hours, or a forecast older than 12 hours, is not shown.\u003c/li\u003e\n\u003cli\u003eStation names are shortened to fit the screen.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/Live-TV-setup.md\"\u003eLive TV set-up\u003c/a\u003e\u003c/p\u003e"
},
{
"path":"docs/Live-TV-setup.md",
"title":"Live TV set-up",
"html":"\u003ch1 id=\"h-live-tv-set-up\"\u003eLive TV set-up\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › Live TV set-up\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContents:\u003c/strong\u003e \u003ca href=\"#docs/Live-TV-setup.md:how-it-works\"\u003eHow it works\u003c/a\u003e · \u003ca href=\"#docs/Live-TV-setup.md:1-prepare-jellyfin\"\u003e1. Prepare Jellyfin\u003c/a\u003e ·\n\u003ca href=\"#docs/Live-TV-setup.md:2-get-the-tools\"\u003e2. Get the tools\u003c/a\u003e · \u003ca href=\"#docs/Live-TV-setup.md:3-build-your-channel-list\"\u003e3. Build your channel list\u003c/a\u003e ·\n\u003ca href=\"#docs/Live-TV-setup.md:4-put-the-list-where-the-server-can-read-it\"\u003e4. Put the list where the server can read it\u003c/a\u003e ·\n\u003ca href=\"#docs/Live-TV-setup.md:5-check-the-server\"\u003e5. Check the server\u003c/a\u003e · \u003ca href=\"#docs/Live-TV-setup.md:6-optional-a-trial\"\u003e6. Optional: a trial\u003c/a\u003e ·\n\u003ca href=\"#docs/Live-TV-setup.md:7-add-the-tuner\"\u003e7. Add the tuner\u003c/a\u003e · \u003ca href=\"#docs/Live-TV-setup.md:8-watch\"\u003e8. Watch\u003c/a\u003e · \u003ca href=\"#docs/Live-TV-setup.md:change-your-channels\"\u003eChange your channels\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eLive TV is \u003cstrong\u003eoptional\u003c/strong\u003e. Local Weather works without any of this.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eThe easy way: Chromatic Manager.\u003c/strong\u003e \u003cstrong\u003eSettings › Live TV channels\u003c/strong\u003e (text menu \u003ccode\u003el\u003c/code\u003e): tick channel groups (English\ncartoons, US weather, US news, classic TV), choose the folder on your PC that holds your Jellyfin library folders,\nsign in as an administrator for that one job, \u003cstrong\u003eDry run\u003c/strong\u003e, then \u003cstrong\u003eAdd\u003c/strong\u003e and \u003cstrong\u003eApprove\u003c/strong\u003e. Then \u003cstrong\u003eSettings › Apps\u003c/strong\u003e ›\n\"Local Weather and your Jellyfin server's Live TV channels\". It adds the same one tuner, under the same name, with the\nsame rules (allowing 2 channels at once), and \u003cstrong\u003eRemove\u003c/strong\u003e undoes it.\u003c/p\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/manager-livetv.png\" width=\"600\" alt=\"Chromatic Manager: Live TV channels, a dry run (private fields masked)\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eBy hand, with the tools here\u003c/strong\u003e, for your own choice of channels and stream limit: the steps below. The tools and\nChromatic Manager recognise each other's tuner, so either one's \u003cstrong\u003eRemove\u003c/strong\u003e works, and neither adds a second tuner.\u003c/p\u003e\n\u003ch2 id=\"h-how-it-works\"\u003eHow it works\u003c/h2\u003e\n\u003cp\u003eThe Chromatic cannot decode the channels' own video (H.264). Your Jellyfin server's built-in \u003cstrong\u003eLive TV\u003c/strong\u003e feature\nreads a channel list (an \u003ccode\u003e.m3u\u003c/code\u003e file) as a \"tuner\", and converts the channel you watch into the small MJPEG picture\nand ADPCM sound the Chromatic already plays, exactly as it does for films. The console asks for at most 400 kbit/s\nand one stream at a time; the tuner allows at most 1 (or 2) channels converted at once.\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e broadcasters' free streams ──► your Jellyfin server (Live TV tuner + conversion) ──Wi-Fi──► Chromatic, TV row\n                                        ▲\n                        your channel list file (made on your PC, kept on your server)\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"h-1-prepare-jellyfin\"\u003e1. Prepare Jellyfin\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eKeep the server on your \u003cstrong\u003ehome network only\u003c/strong\u003e (\u003ca href=\"#docs/Server-safety.md\"\u003eServer safety\u003c/a\u003e).\u003c/li\u003e\n\u003cli\u003eCheck that conversion works: \u003cstrong\u003eDashboard › Playback › Transcoding\u003c/strong\u003e (the default settings are fine).\u003c/li\u003e\n\u003cli\u003eMake or choose a \u003cstrong\u003enormal user for the console\u003c/strong\u003e (not an administrator): \u003cstrong\u003eDashboard › Users\u003c/strong\u003e. In that user's\nsettings turn on \u003cstrong\u003eAllow Live TV access\u003c/strong\u003e. Give it only the libraries you want on the console.\u003c/li\u003e\n\u003cli\u003eSign the console in \u003cstrong\u003eas that user\u003c/strong\u003e: on the console, Jellyfin › \u003cstrong\u003eSelect\u003c/strong\u003e › Jellyfin server; approve its\nQuick Connect code in a Jellyfin app where you are signed in as that user.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"h-2-get-the-tools\"\u003e2. Get the tools\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eInstall \u003cstrong\u003ePython 3.10 or newer\u003c/strong\u003e (python.org). Nothing else is needed.\u003c/li\u003e\n\u003cli\u003eDownload this repository (Code › Download ZIP, or \u003ccode\u003egit clone\u003c/code\u003e) and unzip it.\u003c/li\u003e\n\u003cli\u003eOpen a terminal in the repository folder. The commands below use \u003ccode\u003epy -3\u003c/code\u003e (Windows); on macOS or Linux use\n\u003ccode\u003epython3\u003c/code\u003e.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eThe tools sign in with an administrator \u003cstrong\u003eonly when you ask them to\u003c/strong\u003e (\u003ccode\u003e--ask-admin\u003c/code\u003e): they ask for the name and\npassword, keep them in memory for that one run, and sign that run's own session out at the end. Nothing is saved.\nWithout \u003ccode\u003e--ask-admin\u003c/code\u003e they use the Jellyfin settings saved for Chromatic Manager (or\n\u003ccode\u003e%LOCALAPPDATA%\\Chromavision\\jellyfin-connection.txt\u003c/code\u003e, see \u003ccode\u003ejellyfin-connection.example.txt\u003c/code\u003e), which is fine for\nthe read-only \u003ccode\u003echeck\u003c/code\u003e and \u003ccode\u003estatus\u003c/code\u003e.\u003c/p\u003e\n\u003ch2 id=\"h-3-build-your-channel-list\"\u003e3. Build your channel list\u003c/h2\u003e\n\u003cpre\u003e\u003ccode\u003epy -3 tools\\make_channel_list.py --list-groups\npy -3 tools\\make_channel_list.py --group weather --group animation --group classic\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIt reads the public iptv-org data, keeps only the channels that pass every rule (English, not geo-blocked, no\npay-TV re-streams, no bare IP addresses, and more: \u003ca href=\"#docs/Choosing-channels.md\"\u003eChoosing channels\u003c/a\u003e) and writes\n\u003ccode\u003echannels.m3u\u003c/code\u003e to your private folder (\u003ccode\u003e%LOCALAPPDATA%\\Chromavision\\\u003c/code\u003e). Add \u003ccode\u003e--pick\u003c/code\u003e to choose single channels.\u003c/p\u003e\n\u003ch2 id=\"h-4-put-the-list-where-the-server-can-read-it\"\u003e4. Put the list where the server can read it\u003c/h2\u003e\n\u003cp\u003eThe tuner reads the file \u003cstrong\u003eas the server sees it\u003c/strong\u003e. Copy \u003ccode\u003echannels.m3u\u003c/code\u003e into a folder the Jellyfin server can read,\noutside your media libraries, and note the path the \u003cstrong\u003eserver\u003c/strong\u003e uses for it (Chromatic Manager's own set-up does it\ndifferently: it puts the list in a new folder \"ChromaticTV\" inside one of your library folders, which the server\nalready sees; both work):\u003c/p\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eJellyfin runs\u003c/th\u003e\n\u003cth\u003eCopy the file to\u003c/th\u003e\n\u003cth\u003eThe server path (\u003ccode\u003e--server-path\u003c/code\u003e)\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003ein Docker, with its configuration folder mounted at \u003ccode\u003e/config\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003e\u0026lt;the host folder mounted as /config\u0026gt;/chromavision/channels.m3u\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003e/config/chromavision/channels.m3u\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eas a Windows service\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eC:\\ProgramData\\Jellyfin\\Server\\chromavision\\channels.m3u\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003ethe same path\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003efrom the Linux package\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003e/var/lib/jellyfin/chromavision/channels.m3u\u003c/code\u003e (readable by the \u003ccode\u003ejellyfin\u003c/code\u003e user)\u003c/td\u003e\n\u003ctd\u003ethe same path\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eOnly folders that are mounted into a Jellyfin container are visible to it: a file elsewhere on the same disk is not.\nThe tool checks, read-only, that the server lists the file before it adds anything.\u003c/p\u003e\n\u003ch2 id=\"h-5-check-the-server\"\u003e5. Check the server\u003c/h2\u003e\n\u003cpre\u003e\u003ccode\u003epy -3 tools\\livetv_tuner.py check --ask-admin\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eRead-only. It says whether the version is new enough, whether Live TV settings can be read, how many tuners and\nchannels there are, and saves a backup of the Live TV settings in your private folder. \u003cstrong\u003eNothing is changed.\u003c/strong\u003e\u003c/p\u003e\n\u003ch2 id=\"h-6-optional-a-trial\"\u003e6. Optional: a trial\u003c/h2\u003e\n\u003cp\u003eBuild a small trial list with the same rules as your real one, put it where the server can read it (step 4), then:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003epy -3 tools\\make_channel_list.py --group weather --max 3 --out \u0026lt;a folder outside the repository\u0026gt;\\trial.m3u\npy -3 tools\\livetv_tuner.py trial --server-path /config/chromavision/trial.m3u --yes --ask-admin\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIt adds a \u003cstrong\u003etemporary\u003c/strong\u003e tuner reading that list (one stream at most), plays one channel for\n20 seconds in the Chromatic's format, closes it, \u003cstrong\u003edeletes the tuner\u003c/strong\u003e and proves the Live TV settings and the rest\nof the server are exactly as before. Use it to see that your server can convert live channels before you add your\nown list. Its test channels leave the list at the next guide refresh.\u003c/p\u003e\n\u003ch2 id=\"h-7-add-the-tuner\"\u003e7. Add the tuner\u003c/h2\u003e\n\u003cpre\u003e\u003ccode\u003epy -3 tools\\livetv_tuner.py add --server-path /config/chromavision/channels.m3u --ask-admin\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eA \u003cstrong\u003edry run\u003c/strong\u003e: it checks the server sees the file and shows exactly what it would add (one tuner, its name, its\nstream limit). Nothing is sent. When it looks right, run it again with \u003ccode\u003e--yes\u003c/code\u003e:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003epy -3 tools\\livetv_tuner.py add --server-path /config/chromavision/channels.m3u --yes --ask-admin\npy -3 tools\\livetv_tuner.py refresh-guide --yes --ask-admin\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003eadd --yes\u003c/code\u003e saves a backup, adds the one tuner named \"Chromavision Live TV (added by Chromavision tools)\", records\nits id in your private folder, and proves nothing else changed. \u003ccode\u003e--streams 2\u003c/code\u003e allows two channels at once (for\nexample the console and one other screen); the default is 1. \u003ccode\u003erefresh-guide\u003c/code\u003e runs Jellyfin's own guide refresh\nonce so the channels appear at once.\u003c/p\u003e\n\u003ch2 id=\"h-8-watch\"\u003e8. Watch\u003c/h2\u003e\n\u003cp\u003eTurn the list on for the console: Chromatic Manager › \u003cstrong\u003eSettings › Apps\u003c/strong\u003e › \"Local Weather and your Jellyfin server's\nLive TV channels\" (with Local Weather only, TV opens straight to the weather). Then start-up menu › \u003cstrong\u003eTV\u003c/strong\u003e: your\nchannels are listed under the Local Weather row. Highlight one and press \u003cstrong\u003eA\u003c/strong\u003e\n(\u003ca href=\"#docs/Using-TV.md\"\u003eUsing TV\u003c/a\u003e).\u003c/p\u003e\n\u003ch2 id=\"h-change-your-channels\"\u003eChange your channels\u003c/h2\u003e\n\u003cp\u003eBuild the list again (step 3), copy it over the old file (step 4, same path), then\n\u003ccode\u003epy -3 tools\\livetv_tuner.py refresh-guide --yes --ask-admin\u003c/code\u003e. The tuner itself stays as it is.\u003c/p\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/Choosing-channels.md\"\u003eChoosing channels\u003c/a\u003e\u003c/p\u003e"
},
{
"path":"docs/Choosing-channels.md",
"title":"Choosing channels",
"html":"\u003ch1 id=\"h-choosing-channels\"\u003eChoosing channels\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › Choosing channels\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContents:\u003c/strong\u003e \u003ca href=\"#docs/Choosing-channels.md:where-the-channels-come-from\"\u003eWhere the channels come from\u003c/a\u003e · \u003ca href=\"#docs/Choosing-channels.md:the-rules\"\u003eThe rules\u003c/a\u003e ·\n\u003ca href=\"#docs/Choosing-channels.md:options\"\u003eOptions\u003c/a\u003e · \u003ca href=\"#docs/Choosing-channels.md:examples\"\u003eExamples\u003c/a\u003e · \u003ca href=\"#docs/Choosing-channels.md:whose-channels-are-these\"\u003eWhose channels are these?\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"h-where-the-channels-come-from\"\u003eWhere the channels come from\u003c/h2\u003e\n\u003cp\u003e\u003ca href=\"https://github.com/iptv-org/iptv\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eiptv-org\u003c/a\u003e keeps a public, community-made index of free TV streams, with an open\ndata set (\u003ca href=\"https://github.com/iptv-org/api\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eiptv-org/api\u003c/a\u003e): channels, their feeds and languages, stream addresses,\nlabels such as \"Geo-blocked\", and a blocklist of channels removed after a rights claim. iptv-org hosts no video.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003etools/make_channel_list.py\u003c/code\u003e reads that data and writes \u003cstrong\u003eyour own\u003c/strong\u003e list. Lists are personal: the tool writes\ninto your private folder and refuses to write inside this repository, and no list is ever published here.\u003c/p\u003e\n\u003ch2 id=\"h-the-rules\"\u003eThe rules\u003c/h2\u003e\n\u003cp\u003eEvery channel in your list passed all of these:\u003c/p\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eRule\u003c/th\u003e\n\u003cth\u003eWhy\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eIn the \u003cstrong\u003egroups\u003c/strong\u003e you chose (iptv-org categories such as \u003ccode\u003eweather\u003c/code\u003e, \u003ccode\u003eanimation\u003c/code\u003e, \u003ccode\u003eclassic\u003c/code\u003e, \u003ccode\u003enews\u003c/code\u003e) and \u003cstrong\u003ecountries\u003c/strong\u003e (default: US)\u003c/td\u003e\n\u003ctd\u003eYou decide what you get\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eNot closed, not marked adult, not on iptv-org's \u003cstrong\u003eblocklist\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eRemoved channels and rights claims stay out\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eThe feed's \u003cstrong\u003elanguage\u003c/strong\u003e is the one you chose (default: English); no language data means left out\u003c/td\u003e\n\u003ctd\u003eA channel with another language mixed into its only sound track is no fun on a handheld\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eNot labelled \u003cstrong\u003eGeo-blocked\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eIt would not play at your home anyway\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eNot labelled \u003cstrong\u003eNot 24/7\u003c/strong\u003e (unless \u003ccode\u003e--keep-not-24-7\u003c/code\u003e)\u003c/td\u003e\n\u003ctd\u003eFewer \"No signal\" screens\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eNot served from a \u003cstrong\u003ebare IP address\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eA common sign of a re-stream\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eA plain web address with no spaces, line breaks or control characters\u003c/td\u003e\n\u003ctd\u003eThird-party data cannot add lines to your list; names and headers are cleaned the same way\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eNot a \u003cstrong\u003epay-TV brand\u003c/strong\u003e (cable and premium networks)\u003c/td\u003e\n\u003ctd\u003eTheir entries in public lists are re-streams by third parties: \u003cstrong\u003enever offered\u003c/strong\u003e, even if asked for by name\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eNot reached through a \u003cstrong\u003ethird-party redirect\u003c/strong\u003e (unless \u003ccode\u003e--allow-redirects\u003c/code\u003e)\u003c/td\u003e\n\u003ctd\u003eThe address belongs to someone in between, not the broadcaster; whether you may watch such platform channels outside the platform's own apps is your call\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eYour own \u003ccode\u003e--exclude\u003c/code\u003e and \u003ccode\u003e--include\u003c/code\u003e patterns\u003c/td\u003e\n\u003ctd\u003eFine-tuning\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eWhen a channel has several copies, the \u003cstrong\u003esmallest picture\u003c/strong\u003e is kept: the console shows at most 160 × 120, so your\nserver has less to convert.\u003c/p\u003e\n\u003ch2 id=\"h-options\"\u003eOptions\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eOption\u003c/th\u003e\n\u003cth\u003eDoes\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003e--list-groups\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003ePrints the groups and how many channels each would give with your other options\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003e--group NAME\u003c/code\u003e (repeat) / \u003ccode\u003e--all-groups\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eWhat to take (adult groups are never taken)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003e--country XX\u003c/code\u003e (repeat)\u003c/td\u003e\n\u003ctd\u003eTwo-letter country codes; default \u003ccode\u003eUS\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003e--language xxx\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eThree-letter language code; default \u003ccode\u003eeng\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003e--keep-not-24-7\u003c/code\u003e, \u003ccode\u003e--allow-redirects\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eRelax those two rules\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003e--include PATTERN\u003c/code\u003e, \u003ccode\u003e--exclude PATTERN\u003c/code\u003e (repeat)\u003c/td\u003e\n\u003ctd\u003eKeep only / leave out names matching a pattern (not case-sensitive)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003e--pick\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eShows the numbered list and asks which to keep (\u003ccode\u003e1-5,8,12\u003c/code\u003e)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003e--max N\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eKeep at most N channels\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003e--show\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003ePrints the kept names\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003e--out FILE\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eWrite somewhere else (never inside the repository)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003e--source DIR\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eRead the four iptv-org data files from a folder instead of the internet\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eThe tool prints counts of what was kept and why the rest was left out; it never prints stream addresses.\u003c/p\u003e\n\u003ch2 id=\"h-examples\"\u003eExamples\u003c/h2\u003e\n\u003cpre\u003e\u003ccode\u003epy -3 tools\\make_channel_list.py --group weather --group animation --show\npy -3 tools\\make_channel_list.py --group classic --group comedy --exclude \"late night\" --pick\npy -3 tools\\make_channel_list.py --group news --max 10\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"h-whose-channels-are-these\"\u003eWhose channels are these?\u003c/h2\u003e\n\u003cp\u003eEach stream belongs to its broadcaster. The list data is public domain (The Unlicense), but that says nothing about\nthe rights to each stream. Chromavision lists only free channels offered to the public, leaves pay-TV re-streams out\non purpose, keeps the adverts in, and records nothing. Links break often (some channels are gone the next day): build\nthe list again now and then.\u003c/p\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/Using-TV.md\"\u003eUsing TV\u003c/a\u003e\u003c/p\u003e"
},

"path":"docs/Using-TV.md",
"title":"Using TV",
"html":"\u003ch1 id=\"h-using-tv\"\u003eUsing TV\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e › Using TV\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eContents:\u003c/strong\u003e \u003ca href=\"#docs/Using-TV.md:the-channel-list\"\u003eThe channel list\u003c/a\u003e · \u003ca href=\"#docs/Using-TV.md:watching\"\u003eWatching\u003c/a\u003e · \u003ca href=\"#docs/Using-TV.md:what-the-screen-says\"\u003eWhat the screen says\u003c/a\u003e ·\n\u003ca href=\"#docs/Using-TV.md:leaving\"\u003eLeaving\u003c/a\u003e · \u003ca href=\"#docs/Using-TV.md:limits\"\u003eLimits\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"h-the-channel-list\"\u003eThe channel list\u003c/h2\u003e\n\u003cp\u003eWith Live TV turned on (Chromatic Manager › Settings › Apps), start-up menu › \u003cstrong\u003eTV\u003c/strong\u003e › \u003cstrong\u003eA\u003c/strong\u003e opens the list at once:\n\u003cstrong\u003eWX LOCAL WEATHER\u003c/strong\u003e first, then your server's Live TV channels, seven to a page, with number and name. (With Local\nWeather only, TV opens straight to the weather.)\u003c/p\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eButton\u003c/th\u003e\n\u003cth\u003eDoes\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eUp / Down\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eMove (wraps round, pages turn by themselves)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eA\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eWatch the highlighted channel\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eB\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eBack to the start-up menu\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eSelect\u003c/strong\u003e (on the start-up menu's TV row)\u003c/td\u003e\n\u003ctd\u003eAsks \"Hide TV?\" (bring it back: Other firmware › Show hidden apps)\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/tv-channel-list.png\" width=\"320\" alt=\"The channel list (sample names)\"\u003e\n\u003cimg src=\"docs/images/tv-playing.png\" width=\"320\" alt=\"Watching (a test pattern)\"\u003e\u003c/p\u003e\n\u003cp\u003eIf the server or its Live TV does not answer, the list still shows the weather row, a \u003cstrong\u003eTry again\u003c/strong\u003e row and the\nreason. \u003cstrong\u003eSelect\u003c/strong\u003e finds the server again or signs in again, as on the Jellyfin page. If the server has no Live TV\nchannels yet, the list says \u003cstrong\u003eNo Live TV channels yet\u003c/strong\u003e under the weather row.\u003c/p\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/tv-no-live-tv-yet.png\" width=\"320\" alt=\"No Live TV channels yet. Add them in Chromatic Manager: Settings, Live TV channels\"\u003e\u003c/p\u003e\n\u003ch2 id=\"h-watching\"\u003eWatching\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eButton\u003c/th\u003e\n\u003cth\u003eDoes\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eUp\u003c/strong\u003e / \u003cstrong\u003eDown\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eNext / previous channel. The channel starts 1.5 seconds after your last press, so you can skip through\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eA\u003c/strong\u003e, \u003cstrong\u003eStart\u003c/strong\u003e or \u003cstrong\u003eSelect\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eShow the channel's number and name again\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eB\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eBack to the channel list\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eTuning takes a few seconds: your server opens the channel and starts converting it. A channel closed less than\n10 seconds ago is opened again only after those 10 seconds (it gives the server time to clean up). There is no\npause and no rewind: it is live.\u003c/p\u003e\n\u003cp\u003eIf the network is too slow for two 5-second stretches in a row, the console closes the channel and tunes it once\nmore at a lower quality (\"Adjusting quality...\"). The next channel starts at the normal quality again.\u003c/p\u003e\n\u003ch2 id=\"h-what-the-screen-says\"\u003eWhat the screen says\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eMessage\u003c/th\u003e\n\u003cth\u003eMeans\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eOpening TV...\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eThe app is starting\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eNo signal\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eThe channel refused, ended, or sent no picture for 20 seconds. Many free channels come and go; try another one\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eThe server did not answer\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eNo answer within 30 seconds: is the server on?\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eAdjusting quality...\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003eThe console is reopening the channel at a lower quality\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/tv-no-signal.png\" width=\"320\" alt=\"No signal\"\u003e\u003c/p\u003e\n\u003ch2 id=\"h-leaving\"\u003eLeaving\u003c/h2\u003e\n\u003cp\u003eEvery way out (B, another channel, the weather row, Games) closes the stream on the server: the console stops its\nconversion and closes the live channel before it does anything else. If the console is switched off while a channel\nplays, the server notices within about 10 seconds and cleans up by itself.\u003c/p\u003e\n\u003ch2 id=\"h-limits\"\u003eLimits\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eOne channel at a time; no guide (programme titles) yet; long names are cut.\u003c/li\u003e\n\u003cli\u003eNo watch history is written for channels.\u003c/li\u003e\n\u003cli\u003eSound needs Jellymatic's console chip image 18.40 or 18.41.\u003c/li\u003e\n\u003cli\u003eTV and Local Weather are on the Chromatic only, not on the Analogue Pocket.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/Server-safety.md\"\u003eServer safety\u003c/a\u003e\u003c/p\u003e"
}
]
